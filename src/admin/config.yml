                  name: "year",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Thoughts / Mini Review",
                  name: "review",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (IMDb, Letterboxd, TMDB)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

          - label: "TV Shows & Series (Section 2)"
            name: "shows"
            widget: "list"
            summary: "{{fields.title}} [{{fields.status}}]"
