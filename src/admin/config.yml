backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: "content({{collection}}): create {{slug}}"
    update: "content({{collection}}): update {{slug}}"
    delete: "content({{collection}}): delete {{slug}}"
    uploadMedia: "media: upload {{path}}"
    deleteMedia: "media: delete {{path}}"

publish_mode: editorial_workflow
display_url: "https://amitendu.me"
logo_url: "/favicon.svg"

media_folder: "src/images"
public_folder: "/images"
max_file_size: 10485760

media_processing:
  enabled: true
  quality: 80
  width: 1600
  strip_metadata: true
  format:
    enabled: true
    default: webp

collections:
  - name: "about"
    label: "About"
    files:
      - name: "me"
        label: "Me"
        file: "src/_data/about.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "About",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "ABOUT THIS PERSON",
            }
          - {
              label: "Header Banner Image",
              name: "headerBanner",
              widget: "image",
              required: false,
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "About me",
            }
          - { label: "Intro", name: "intro", widget: "text" }
          - {
              label: "Profile image",
              name: "profileImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Profile image alt text",
              name: "profileAlt",
              widget: "string",
              required: false,
            }
          - label: "Content (Rich Text / Markdown)"
            name: "content"
            widget: "markdown"
            modes: ["rich_text", "raw"]
            buttons:
              - bold
              - italic
              - code
              - link
              - heading-two
              - heading-three
              - quote
              - bulleted-list
              - numbered-list
            editor_components:
              - image
              - code-block

      - name: "books"
        label: "Books"
        file: "src/_data/books.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Books",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "WHAT I'M READING",
            }
          - {
              label: "Header Banner Image",
              name: "headerBanner",
              widget: "image",
              required: false,
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Bookshelf",
            }
          - {
              label: "Page intro text",
              name: "intro",
              widget: "text",
              required: false,
            }
          - label: "Books List"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} by {{fields.author}} [{{fields.status}}]"
            fields:
              - { label: "Book Title", name: "title", widget: "string" }
              - {
                  label: "Author",
                  name: "author",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Cover Image",
                  name: "image",
                  widget: "image",
                  required: false,
                  hint: "Upload a book cover image (JPG, PNG, WEBP).",
                }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Currently Reading", value: "currently-reading" }
                  - { label: "Completed / Finished", value: "read" }
                  - { label: "Want to Read / Plan to Read", value: "to-read" }
                default: "currently-reading"
              - {
                  label: "Progress / Notes (e.g. Chapter 6 / Page 140)",
                  name: "progress",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Rating (Stars 1-5)",
                  name: "rating",
                  widget: "star-rating",
                  required: false,
                }
              - {
                  label: "Year / Date Read",
                  name: "year",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Thoughts / Mini Review",
                  name: "review",
                  widget: "text",
                  required: false,
                }

