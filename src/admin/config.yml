backend:
  name: git-gateway
  branch: main

media_folder: "src/images"
public_folder: "/images"
max_file_size: 10485760

media_processing:
  enabled: true
  quality: 80
  width: 1600
  strip_metadata: true
  format:
    enabled: true
    default: webp

collections:
  - name: "about-section"
    label: "About (Me, Books, Movies, Games, Software)"
    files:
      - name: "about-me"
        label: "Tab 1: Me"
        file: "src/_data/about.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "About",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "ABOUT THIS PERSON",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "About me",
            }
          - { label: "Intro", name: "intro", widget: "text" }
          - {
              label: "Profile image",
              name: "profileImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Profile image alt text",
              name: "profileAlt",
              widget: "string",
              required: false,
            }
          - label: "Content (Rich Text / Markdown)"
            name: "content"
            widget: "markdown"
            modes: ["rich_text", "raw"]
            buttons:
              - bold
              - italic
              - code
              - link
              - heading-two
              - heading-three
              - quote
              - bulleted-list
              - numbered-list
            editor_components:
              - image
              - code-block

      - name: "about-books"
        label: "Tab 2: Books"
        file: "src/_data/books.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Books",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "WHAT I'M READING",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Bookshelf",
            }
          - {
              label: "Page intro text",
              name: "intro",
              widget: "text",
              required: false,
            }
          - label: "Books List"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} by {{fields.author}} [{{fields.status}}]"
            fields:
              - { label: "Book Title", name: "title", widget: "string" }
              - { label: "Author", name: "author", widget: "string", required: false }
              - {
                  label: "Cover Image",
                  name: "image",
                  widget: "image",
                  required: false,
                  hint: "Upload a book cover image (JPG, PNG, WEBP).",
                }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Currently Reading", value: "currently-reading" }
                  - { label: "Completed / Finished", value: "read" }
                  - { label: "Want to Read / Plan to Read", value: "to-read" }
                default: "currently-reading"
              - {
                  label: "Progress / Notes (e.g. Chapter 6 / Page 140)",
                  name: "progress",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Rating (e.g. 5/5, 9/10, or ★★★★★)",
                  name: "rating",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Year / Date Read",
                  name: "year",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Thoughts / Mini Review",
                  name: "review",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (Goodreads, Amazon, or Official Site)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

      - name: "about-movies"
        label: "Tab 3: Movies"
        file: "src/_data/movies.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Movies",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "WHAT I'M WATCHING",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Cinema & Shows",
            }
          - {
              label: "Page intro text",
              name: "intro",
              widget: "text",
              required: false,
            }
          - label: "Movies (Section 1)"
            name: "movies"
            widget: "list"
            summary: "{{fields.title}} [{{fields.status}}]"
            fields:
              - { label: "Movie Title", name: "title", widget: "string" }
              - {
                  label: "Director / Studio",
                  name: "director",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Poster Image",
                  name: "image",
                  widget: "image",
                  required: false,
                  hint: "Upload a movie poster image (JPG, PNG, WEBP).",
                }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Currently Watching", value: "currently-watching" }
                  - { label: "Completed / Watched", value: "watched" }
                  - { label: "Plan to Watch", value: "plan-to-watch" }
                default: "watched"
              - {
                  label: "Rating (e.g. 10/10, 5/5, or ★★★★★)",
                  name: "rating",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Release Year",
                  name: "year",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Thoughts / Mini Review",
                  name: "review",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (IMDb, Letterboxd, TMDB)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

          - label: "TV Shows & Series (Section 2)"
            name: "shows"
            widget: "list"
            summary: "{{fields.title}} [{{fields.status}}]"
            fields:
              - { label: "Show Title", name: "title", widget: "string" }
              - {
                  label: "Creator / Network / Studio",
                  name: "creator",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Poster Image",
                  name: "image",
                  widget: "image",
                  required: false,
                  hint: "Upload a show poster image (JPG, PNG, WEBP).",
                }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Currently Watching", value: "currently-watching" }
                  - { label: "Completed / Finished", value: "watched" }
                  - { label: "Plan to Watch", value: "plan-to-watch" }
                default: "currently-watching"
              - {
                  label: "Progress / Notes (e.g. Season 2 or S03E04)",
                  name: "progress",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Rating (e.g. 10/10, 5/5, or ★★★★★)",
                  name: "rating",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Year / Airing Period",
                  name: "year",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Thoughts / Mini Review",
                  name: "review",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (IMDb, TMDB, MyAnimeList)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

      - name: "about-games"
        label: "Tab 4: Games"
        file: "src/_data/games.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Games",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "WHAT I'M PLAYING",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Games",
            }
          - {
              label: "Page intro text",
              name: "intro",
              widget: "text",
              required: false,
            }
          - label: "Games List"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} [{{fields.status}}]"
            fields:
              - { label: "Game Name", name: "name", widget: "string" }
              - {
                  label: "Icon / Cover Image",
                  name: "icon",
                  widget: "image",
                  required: false,
                  hint: "Upload a game icon or box art (PNG, SVG, WEBP, JPG).",
                }
              - {
                  label: "Platform (e.g. PC, Switch, PS5, Steam Deck)",
                  name: "platform",
                  widget: "string",
                  required: false,
                }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Currently Playing", value: "Currently Playing" }
                  - { label: "Completed", value: "Completed" }
                  - { label: "Plan to Play / Backlog", value: "Backlog" }
                  - { label: "On Hold", value: "On Hold" }
                  - { label: "Dropped", value: "Dropped" }
                default: "Currently Playing"
              - {
                  label: "Description / Notes",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (Official Website or Steam Page)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

      - name: "about-software"
        label: "Tab 5: Software"
        file: "src/_data/software.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Software",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "TOOLS & APPS I USE",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Software & Tools",
            }
          - {
              label: "Page intro text",
              name: "intro",
              widget: "text",
              required: false,
            }
          - label: "Software List"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} [{{fields.category}}]"
            fields:
              - { label: "Software / Tool Name", name: "name", widget: "string" }
              - {
                  label: "Icon / Logo Image",
                  name: "icon",
                  widget: "image",
                  required: false,
                  hint: "Upload an app icon or logo (PNG, SVG, WEBP, JPG).",
                }
              - {
                  label: "Category (e.g. Code Editor, Terminal, Productivity, Browser)",
                  name: "category",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Platform / OS (e.g. macOS, Linux, Windows, Web)",
                  name: "platform",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Description / Why I Use It",
                  name: "description",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (Official Website or Download Page)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

  - name: "resume-page"
    label: "Resume / CV"
    files:
      - name: "resume-page"
        label: "Resume / CV Page"
        file: "src/_data/resume.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Resume",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "CURRICULUM VITAE",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Curriculum Vitae",
            }
          - {
              label: "Subheading / Role",
              name: "subheading",
              widget: "string",
              default: "Full-Stack Web Developer & Designer",
              required: false,
            }
          - {
              label: "Professional Summary",
              name: "intro",
              widget: "text",
              required: false,
            }
          - {
              label: "Resume PDF URL or File",
              name: "pdfUrl",
              widget: "file",
              required: false,
            }
          - label: "Contact Details"
            name: "contactDetails"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
          - label: "Work Experience"
            name: "experience"
            widget: "list"
            required: false
            fields:
              - { label: "Job Title", name: "role", widget: "string" }
              - {
                  label: "Company / Organization",
                  name: "company",
                  widget: "string",
                }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Education"
            name: "education"
            widget: "list"
            required: false
            fields:
              - {
                  label: "Degree / Certificate",
                  name: "degree",
                  widget: "string",
                }
              - {
                  label: "Institution / School",
                  name: "institution",
                  widget: "string",
                }
              - { label: "Period", name: "period", widget: "string" }
              - {
                  label: "Details",
                  name: "details",
                  widget: "string",
                  required: false,
                }
          - label: "Skill Categories"
            name: "skillsList"
            widget: "list"
            required: false
            fields:
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Skills", name: "items", widget: "string" }
          - {
              label: "Additional Notes",
              name: "additionalNotes",
              widget: "text",
              required: false,
            }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Homepage"
        file: "src/_data/home.json"
        format: "json"
        fields:
          - { label: "Greeting", name: "greeting", widget: "string" }
          - { label: "Welcome text", name: "welcome", widget: "string" }
          - { label: "About heading", name: "aboutTitle", widget: "string" }
          - { label: "About text", name: "about", widget: "text" }
          - {
              label: "Currently heading",
              name: "currentlyTitle",
              widget: "string",
            }
          - {
              label: "Currently",
              name: "currently",
              widget: "list",
              field: { label: "Item", name: "item", widget: "string" },
            }
          - {
              label: "Profile image",
              name: "profileImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Profile image alt text",
              name: "profileAlt",
              widget: "string",
              required: false,
            }
          - { label: "Status heading", name: "statusTitle", widget: "string" }
          - label: "Status"
            name: "status"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
          - label: "Quick links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - {
              label: "Skills",
              name: "skills",
              widget: "list",
              field: { label: "Skill", name: "skill", widget: "string" },
            }
      - name: "blog-page"
        label: "Blog landing page"
        file: "src/_data/blogPage.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Blog",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "MY WEB LOG",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Web log",
            }
          - { label: "Intro", name: "intro", widget: "text" }
      - name: "portfolio-page"
        label: "Portfolio landing page"
        file: "src/_data/portfolioPage.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Portfolio",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "MY WEB PORTFOLIO",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "My work",
            }
          - { label: "Intro", name: "intro", widget: "text" }
      - name: "site"
        label: "Site settings"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Site title", name: "title", widget: "string" }
          - { label: "Header tagline", name: "tagline", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Footer text", name: "footer", widget: "string" }
          - { label: "Footer title", name: "footerTitle", widget: "string" }
          - { label: "Footer badge", name: "footerBadge", widget: "string" }
          - { label: "Visitor count", name: "visitorCount", widget: "string" }
          - label: "Left sidebar"
            name: "leftSidebar"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
          - label: "Right sidebar"
            name: "rightSidebar"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - label: "Website Icon"
                    name: "icon"
                    widget: "select"
                    required: false
                    options:
                      - { label: "Auto (Detect from URL/Label)", value: "" }
                      - { label: "DEV Community (dev.to)", value: "dev.to" }
                      - { label: "Discord", value: "discord" }
                      - { label: "Figma", value: "figma" }
                      - { label: "Finder", value: "finder" }
                      - { label: "GitHub", value: "github" }
                      - { label: "Hashnode", value: "hashnode" }
                      - { label: "Instagram", value: "instagram" }
                      - { label: "LinkedIn", value: "linkedin" }
                      - { label: "Apple Mail", value: "mail" }
                      - { label: "Masterji", value: "masterji" }
                      - { label: "Medium", value: "medium" }
                      - { label: "Notes", value: "notes" }
                      - { label: "Peerlist", value: "peerlist" }
                      - { label: "Safari / Web", value: "safari" }
                      - { label: "Terminal", value: "terminal" }
                      - { label: "Twitter / X", value: "twitter" }
                      - { label: "X (Twitter)", value: "x" }
                      - { label: "YouTube", value: "youtube" }
          - label: "Author Profile"
            name: "author"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Subtitle", name: "role", widget: "string" }
              - { label: "Avatar", name: "avatar", widget: "image" }
              - { label: "Mini Bio", name: "bio", widget: "string" }
              - { label: "Resume URL", name: "resumeUrl", widget: "string" }
          - label: "Sidebar Settings"
            name: "sidebar"
            widget: "object"
            fields:
              - {
                  label: "Recent Posts Title",
                  name: "recentPostsTitle",
                  widget: "string",
                  default: "Recent Posts",
                }
              - {
                  label: "Recent Posts Limit",
                  name: "recentPostsLimit",
                  widget: "number",
                  value_type: "int",
                  default: 3,
                }
              - {
                  label: "Favorites Title",
                  name: "favoritesTitle",
                  widget: "string",
                  default: "Favorites",
                }
          - {
              label: "Featured item limit",
              name: "featuredLimit",
              widget: "number",
              value_type: "int",
              default: 4,
            }

  - name: "blog"
    label: "Blog posts"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    view_filters:
      - label: "Published"
        field: "tags"
        pattern: "post"
      - label: "Favorites"
        field: "tags"
        pattern: "fav"
      - label: "Drafts"
        field: "tags"
        pattern: "draft"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "post.njk",
        }
      - label: "Status (Tag)"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Post (Published)", value: "post" }
          - { label: "Draft (Hidden from site)", value: "draft" }
          - { label: "Favorite / Starred", value: "fav" }
        default: ["post"]
        hint: "Choose 'post' to publish on blog, 'fav' for starred favorite, or 'draft' to save as draft."
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "string",
          default: "BLOG POST",
        }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Amitendu Bikash Dhusiya",
        }
      - {
          label: "Current mood",
          name: "mood",
          widget: "string",
          required: false,
          hint: "e.g. thoughtful, caffeinated",
        }
      - {
          label: "Current music",
          name: "music",
          widget: "string",
          required: false,
          hint: "e.g. Daft Punk - Digital Love",
        }
      - {
          label: "Featured image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Upload an image or use an external image URL.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Portfolio projects"
    folder: "src/portfolio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    view_filters:
      - label: "Published"
        field: "tags"
        pattern: "portfolio"
      - label: "Favorites"
        field: "tags"
        pattern: "fav"
      - label: "Drafts"
        field: "tags"
        pattern: "draft"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "base.njk",
        }
      - label: "Status (Tag)"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Portfolio (Published)", value: "portfolio" }
          - { label: "Draft (Hidden from site)", value: "draft" }
          - { label: "Favorite / Starred", value: "fav" }
        default: ["portfolio"]
        hint: "Choose 'portfolio' to publish, 'fav' for starred favorite, or 'draft' to save as draft."
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "string",
          default: "PORTFOLIO PROJECT",
        }
      - { label: "Description", name: "description", widget: "string" }
      - {
          label: "Featured image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Upload an image or use an external image URL.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "authors"
    label: "Authors"
    folder: "src/authors"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "base.njk",
        }
      - {
          label: "Page title",
          name: "title",
          widget: "hidden",
