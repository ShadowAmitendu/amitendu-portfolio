              - { label: "Show Title", name: "title", widget: "string" }
              - {
                  label: "Creator / Network / Studio",
                  name: "creator",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Poster Image",
                  name: "image",
                  widget: "image",
                  required: false,
                  hint: "Upload a show poster image (JPG, PNG, WEBP).",
                }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "Currently Watching", value: "currently-watching" }
                  - { label: "Completed / Finished", value: "watched" }
                  - { label: "Plan to Watch", value: "plan-to-watch" }
                default: "currently-watching"
              - {
                  label: "Progress / Notes (e.g. Season 2 or S03E04)",
                  name: "progress",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Rating (Stars 1-5)",
                  name: "rating",
                  widget: "star-rating",
                  required: false,
                }
              - {
                  label: "Year / Airing Period",
                  name: "year",
                  widget: "string",
                  required: false,
                }
              - {
                  label: "Thoughts / Mini Review",
                  name: "review",
                  widget: "text",
                  required: false,
                }
              - {
                  label: "Link (IMDb, TMDB, MyAnimeList)",
                  name: "link",
                  widget: "string",
                  required: false,
                }

      - name: "games"
        label: "Games"
        file: "src/_data/games.json"
        format: "json"
        fields:
