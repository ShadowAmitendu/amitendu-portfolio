                  hint: "Enable to feature this game in the 'Games I play' card on the Home page and Sidebar.",
                }
              - {
                  label: "Cover / Box Art Image",
                  name: "image",
                  widget: "image",
                  required: false,
                  hint: "Upload a game cover image or box art (JPG, PNG, WEBP).",
                }
              - {
                  label: "Icon / Mini Logo (Optional)",
                  name: "icon",
                  widget: "image",
                  required: false,
                  hint: "Upload a small game icon (PNG, SVG, WEBP).",
