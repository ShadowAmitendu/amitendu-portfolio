backend:
  name: git-gateway
  branch: main

media_folder: "src/images"
public_folder: "/images"
max_file_size: 10485760

media_processing:
  enabled: true
  quality: 80
  width: 1600
  strip_metadata: true
  format:
    enabled: true
    default: webp

collections:
  - name: "about-page"
    label: "About (Author Page)"
    files:
      - name: "about-page"
        label: "About Me"
        file: "src/_data/about.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "About",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "ABOUT THIS PERSON",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "About me",
            }
          - { label: "Intro", name: "intro", widget: "text" }
          - {
              label: "Profile image",
              name: "profileImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Profile image alt text",
              name: "profileAlt",
              widget: "string",
              required: false,
            }
          - label: "Content (Rich Text / Markdown)"
            name: "content"
            widget: "markdown"
            modes: ["rich_text", "raw"]
            buttons:
              - bold
              - italic
              - code
              - link
              - heading-two
              - heading-three
              - quote
              - bulleted-list
              - numbered-list
            editor_components:
              - image
              - code-block

  - name: "resume-page"
    label: "Resume / CV"
    files:
      - name: "resume-page"
        label: "Resume / CV Page"
        file: "src/_data/resume.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Resume",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "CURRICULUM VITAE",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Curriculum Vitae",
            }
          - {
              label: "Subheading / Role",
              name: "subheading",
              widget: "string",
              default: "Full-Stack Web Developer & Designer",
              required: false,
            }
          - {
              label: "Professional Summary",
              name: "intro",
              widget: "text",
              required: false,
            }
          - {
              label: "Resume PDF URL or File",
              name: "pdfUrl",
              widget: "file",
              required: false,
            }
          - label: "Contact Details"
            name: "contactDetails"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
              - { label: "URL", name: "url", widget: "string", required: false }
          - label: "Work Experience"
            name: "experience"
            widget: "list"
            required: false
            fields:
              - { label: "Job Title", name: "role", widget: "string" }
              - {
                  label: "Company / Organization",
                  name: "company",
                  widget: "string",
                }
              - { label: "Period", name: "period", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
          - label: "Education"
            name: "education"
            widget: "list"
            required: false
            fields:
              - {
                  label: "Degree / Certificate",
                  name: "degree",
                  widget: "string",
                }
              - {
                  label: "Institution / School",
                  name: "institution",
                  widget: "string",
                }
              - { label: "Period", name: "period", widget: "string" }
              - {
                  label: "Details",
                  name: "details",
                  widget: "string",
                  required: false,
                }
          - label: "Skill Categories"
            name: "skillsList"
            widget: "list"
            required: false
            fields:
              - { label: "Category", name: "category", widget: "string" }
              - { label: "Skills", name: "items", widget: "string" }
          - {
              label: "Additional Notes",
              name: "additionalNotes",
              widget: "text",
              required: false,
            }

  - name: "pages"
    label: "Pages"
    files:
      - name: "home"
        label: "Homepage"
        file: "src/_data/home.json"
        format: "json"
        fields:
          - { label: "Greeting", name: "greeting", widget: "string" }
          - { label: "Welcome text", name: "welcome", widget: "string" }
          - { label: "About heading", name: "aboutTitle", widget: "string" }
          - { label: "About text", name: "about", widget: "text" }
          - {
              label: "Currently heading",
              name: "currentlyTitle",
              widget: "string",
            }
          - {
              label: "Currently",
              name: "currently",
              widget: "list",
              field: { label: "Item", name: "item", widget: "string" },
            }
          - {
              label: "Profile image",
              name: "profileImage",
              widget: "image",
              required: false,
            }
          - {
              label: "Profile image alt text",
              name: "profileAlt",
              widget: "string",
              required: false,
            }
          - { label: "Status heading", name: "statusTitle", widget: "string" }
          - label: "Status"
            name: "status"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Value", name: "value", widget: "string" }
          - label: "Quick links"
            name: "links"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - {
              label: "Skills",
              name: "skills",
              widget: "list",
              field: { label: "Skill", name: "skill", widget: "string" },
            }
      - name: "blog-page"
        label: "Blog landing page"
        file: "src/_data/blogPage.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Blog",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "MY WEB LOG",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "Web log",
            }
          - { label: "Intro", name: "intro", widget: "text" }
      - name: "portfolio-page"
        label: "Portfolio landing page"
        file: "src/_data/portfolioPage.json"
        format: "json"
        fields:
          - {
              label: "Page title",
              name: "title",
              widget: "string",
              default: "Portfolio",
            }
          - {
              label: "Header tagline",
              name: "headerTagline",
              widget: "string",
              default: "MY WEB PORTFOLIO",
            }
          - {
              label: "Heading",
              name: "heading",
              widget: "string",
              default: "My work",
            }
          - { label: "Intro", name: "intro", widget: "text" }
      - name: "site"
        label: "Site settings"
        file: "src/_data/site.json"
        format: "json"
        fields:
          - { label: "Site title", name: "title", widget: "string" }
          - { label: "Header tagline", name: "tagline", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Footer text", name: "footer", widget: "string" }
          - { label: "Footer title", name: "footerTitle", widget: "string" }
          - { label: "Footer badge", name: "footerBadge", widget: "string" }
          - { label: "Visitor count", name: "visitorCount", widget: "string" }
          - label: "Left sidebar"
            name: "leftSidebar"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
          - label: "Right sidebar"
            name: "rightSidebar"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - label: "macOS Icon"
                    name: "icon"
                    widget: "select"
                    required: false
                    options:
                      - { label: "Auto (Detect from URL/Label)", value: "" }
                      - { label: "GitHub", value: "github" }
                      - { label: "Apple Mail", value: "mail" }
                      - { label: "Safari / Web", value: "safari" }
                      - { label: "Terminal", value: "terminal" }
                      - { label: "Finder", value: "finder" }
                      - { label: "LinkedIn", value: "linkedin" }
                      - { label: "Twitter / X", value: "twitter" }
                      - { label: "Discord", value: "discord" }
                      - { label: "YouTube", value: "youtube" }
                      - { label: "Notes", value: "notes" }
          - {
              label: "Featured item limit",
              name: "featuredLimit",
              widget: "number",
              value_type: "int",
              default: 4,
            }

  - name: "blog"
    label: "Blog posts"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    view_filters:
      - label: "Published"
        field: "tags"
        pattern: "post"
      - label: "Drafts"
        field: "tags"
        pattern: "draft"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "post.njk",
        }
      - label: "Status (Tag)"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Post (Published)", value: "post" }
          - { label: "Draft (Hidden from site)", value: "draft" }
        default: ["post"]
        hint: "Choose 'post' to publish on blog, or 'draft' to save as draft."
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "string",
          default: "BLOG POST",
        }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Amitendu Bikash Dhusiya",
        }
      - {
          label: "Current mood",
          name: "mood",
          widget: "string",
          required: false,
          hint: "e.g. thoughtful, caffeinated",
        }
      - {
          label: "Current music",
          name: "music",
          widget: "string",
          required: false,
          hint: "e.g. Daft Punk - Digital Love",
        }
      - {
          label: "Featured image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Upload an image or use an external image URL.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Portfolio projects"
    folder: "src/portfolio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    view_filters:
      - label: "Published"
        field: "tags"
        pattern: "portfolio"
      - label: "Drafts"
        field: "tags"
        pattern: "draft"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "base.njk",
        }
      - label: "Status (Tag)"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Portfolio (Published)", value: "portfolio" }
          - { label: "Draft (Hidden from site)", value: "draft" }
        default: ["portfolio"]
        hint: "Choose 'portfolio' to publish, or 'draft' to save as draft."
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "string",
          default: "PORTFOLIO PROJECT",
        }
      - { label: "Description", name: "description", widget: "string" }
      - {
          label: "Featured image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Upload an image or use an external image URL.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "authors"
    label: "Authors"
    folder: "src/authors"
    create: true
    slug: "{{slug}}"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "base.njk",
        }
      - {
          label: "Page title",
          name: "title",
          widget: "hidden",
          default: "Author Profile",
        }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "hidden",
          default: "AUTHOR PROFILE",
        }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - {
          label: "Profile image",
          name: "image",
          widget: "image",
          required: false,
        }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - {
          label: "Hide hero image",
          name: "hideHeroImage",
          widget: "hidden",
          default: true,
        }
