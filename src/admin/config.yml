                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
          - label: "Right sidebar"
            name: "rightSidebar"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - label: "Links"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
                  - label: "Website Icon"
                    name: "icon"
                    widget: "select"
                    required: false
                    options:
                      - { label: "Auto (Detect from URL/Label)", value: "" }
                      - { label: "DEV Community (dev.to)", value: "dev.to" }
                      - { label: "Discord", value: "discord" }
                      - { label: "Figma", value: "figma" }
                      - { label: "Finder", value: "finder" }
                      - { label: "GitHub", value: "github" }
                      - { label: "Hashnode", value: "hashnode" }
                      - { label: "Instagram", value: "instagram" }
                      - { label: "LinkedIn", value: "linkedin" }
                      - { label: "Apple Mail", value: "mail" }
                      - { label: "Masterji", value: "masterji" }
                      - { label: "Medium", value: "medium" }
                      - { label: "Notes", value: "notes" }
                      - { label: "Peerlist", value: "peerlist" }
                      - { label: "Safari / Web", value: "safari" }
                      - { label: "Terminal", value: "terminal" }
                      - { label: "Twitter / X", value: "twitter" }
                      - { label: "X (Twitter)", value: "x" }
                      - { label: "YouTube", value: "youtube" }

          - label: "Author Profile"
            name: "author"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Role / Subtitle", name: "role", widget: "string" }
              - { label: "Avatar", name: "avatar", widget: "image" }
              - { label: "Mini Bio", name: "bio", widget: "string" }
              - { label: "Resume URL", name: "resumeUrl", widget: "string" }
          - label: "Sidebar Settings"
            name: "sidebar"
            widget: "object"
            fields:
              - {
                  label: "Recent Posts Title",
                  name: "recentPostsTitle",
                  widget: "string",
                  default: "Recent Posts",
                }
              - {
                  label: "Recent Posts Limit",
                  name: "recentPostsLimit",
                  widget: "number",
                  value_type: "int",
                  default: 3,
                }
              - {
                  label: "Favorites Title",
                  name: "favoritesTitle",
                  widget: "string",
                  default: "Favorites",
                }
          - {
              label: "Featured item limit",
              name: "featuredLimit",
              widget: "number",
              value_type: "int",
              default: 4,
            }
          - label: "Announcement Banner"
            name: "announcement"
            widget: "object"
            required: false
            fields:
              - { label: "Enable Announcement", name: "enabled", widget: "boolean", default: false }
              - { label: "Announcement ID / Version Tag", name: "id", widget: "string", default: "welcome-2026", hint: "Change this tag whenever you post a new announcement so visitors who previously dismissed it will see it." }
              - label: "Banner Style / Color"
                name: "type"
                widget: "select"
                default: "info"
                options:
                  - { label: "Aero Blue (General / Welcome)", value: "info" }
                  - { label: "Gold / Amber (Alert / Important)", value: "alert" }
                  - { label: "Emerald Green (Update / Special)", value: "success" }
              - { label: "Announcement Message", name: "message", widget: "string", default: "Welcome to my portfolio! Check out the newly updated retro workspace & books." }
              - { label: "Action Button Text", name: "linkText", widget: "string", required: false, default: "Check it out »" }
              - { label: "Action Button URL", name: "linkUrl", widget: "string", required: false, default: "/about/gear/" }

  - name: "blog"
    label: "Blog posts"
    folder: "src/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: '{{title}} — {{commit_date | date("YYYY-MM-DD")}} ({{tags}})'
    sortable_fields: ["date", "title", "commit_date"]
    view_filters:
      - label: "Published"
        field: "tags"
        pattern: "post"
      - label: "Favorites"
        field: "tags"
        pattern: "fav"
      - label: "Drafts"
        field: "tags"
        pattern: "draft"
    view_groups:
      - label: "Year"
        field: "date"
        pattern: "\\d{4}"
      - label: "Status"
        field: "tags"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "post.njk",
        }
      - label: "Status (Tag)"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Post (Published)", value: "post" }
          - { label: "Draft (Hidden from site)", value: "draft" }
          - { label: "Favorite / Starred", value: "fav" }
        default: ["post"]
        hint: "Choose 'post' to publish on blog, 'fav' for starred favorite, or 'draft' to save as draft."
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "string",
          default: "BLOG POST",
        }
      - { label: "Description", name: "description", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - {
          label: "Author",
          name: "author",
          widget: "string",
          default: "Amitendu Bikash Dhusiya",
        }
      - {
          label: "Current mood",
          name: "mood",
          widget: "string",
          required: false,
          hint: "e.g. thoughtful, caffeinated",
        }
      - {
          label: "Current music",
          name: "music",
          widget: "string",
          required: false,
          hint: "e.g. Daft Punk - Digital Love",
        }
      - {
          label: "Featured image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Upload an image or use an external image URL.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "portfolio"
    label: "Portfolio projects"
    folder: "src/portfolio"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} — ({{tags}})"
    sortable_fields: ["title", "commit_date"]
    view_filters:
      - label: "Published"
        field: "tags"
        pattern: "portfolio"
      - label: "Favorites"
        field: "tags"
        pattern: "fav"
      - label: "Drafts"
        field: "tags"
        pattern: "draft"
    view_groups:
      - label: "Status"
        field: "tags"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "base.njk",
        }
      - label: "Status (Tag)"
        name: "tags"
        widget: "select"
        multiple: true
        options:
          - { label: "Portfolio (Published)", value: "portfolio" }
          - { label: "Draft (Hidden from site)", value: "draft" }
          - { label: "Favorite / Starred", value: "fav" }
        default: ["portfolio"]
        hint: "Choose 'portfolio' to publish, 'fav' for starred favorite, or 'draft' to save as draft."
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "string",
          default: "PORTFOLIO PROJECT",
        }
      - { label: "Description", name: "description", widget: "string" }
      - {
          label: "Featured image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Upload an image or use an external image URL.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "authors"
    label: "Authors"
    folder: "src/authors"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} (@{{slug}})"
    fields:
      - {
          label: "Layout",
          name: "layout",
          widget: "hidden",
          default: "base.njk",
        }
      - {
          label: "Page title",
          name: "title",
          widget: "hidden",
          default: "Author Profile",
        }
      - {
          label: "Header tagline",
          name: "headerTagline",
          widget: "hidden",
          default: "AUTHOR PROFILE",
        }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Name", name: "name", widget: "string" }
      - {
          label: "Profile image",
          name: "image",
          widget: "image",
          required: false,
        }
      - { label: "Bio", name: "bio", widget: "text", required: false }
      - {
          label: "Hide hero image",
          name: "hideHeroImage",
          widget: "hidden",
          default: true,
        }
