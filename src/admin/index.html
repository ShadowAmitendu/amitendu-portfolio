<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Content Manager</title>
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="alternate icon" href="/favicon.ico" />
	<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
	<script>
		// Polyfill / compatibility shim for Decap CMS + Netlify Git Gateway
		// Fixes 401 Restricted errors in Editorial Workflow:
		// 1. Author lookups: Git Gateway blocks /.netlify/git/github/users/:login
		// 2. Editorial notes: Git Gateway blocks general /.netlify/git/github/.../issues
		//    (while safely allowing /.netlify/git/github/.../issues/:number/labels for PR status)
		(function () {
			const originalFetch = window.fetch;
			if (!originalFetch) return;

			window.fetch = async function (resource, init) {
				let url = "";
				if (typeof resource === "string") {
					url = resource;
				} else if (resource && typeof resource.url === "string") {
					url = resource.url;
				} else if (resource && typeof resource.href === "string") {
					url = resource.href;
				} else {
					url = String(resource || "");
				}

				// 1. Intercept author lookups: /.netlify/git/github/users/:login
				const userMatch = url.match(/\/\.netlify\/git\/github\/users\/([^/?#]+)/i);
				if (userMatch) {
					const username = decodeURIComponent(userMatch[1]);
					return new Response(
						JSON.stringify({
							login: username,
							name: username,
						}),
						{
							status: 200,
							statusText: "OK",
							headers: { "Content-Type": "application/json" },
						},
					);
				}

				// 2. Intercept Git Gateway issue endpoints not permitted by Netlify Git Gateway proxy
				if (/\/\.netlify\/git\/github\/.*\/issues\b/i.test(url)) {
					// Allow PR labels update endpoint to pass through to Git Gateway: /issues/:number/labels
					if (!/\/issues\/\d+\/labels(\b|\?|$)/i.test(url)) {
						const method =
							(init && init.method)
								? init.method.toUpperCase()
								: (resource && resource.method)
									? resource.method.toUpperCase()
									: "GET";
						const body = method === "GET" ? "[]" : "{}";
						return new Response(body, {
							status: 200,
							statusText: "OK",
							headers: { "Content-Type": "application/json" },
						});
					}
				}

				// 3. Intercept Media Library for src/images
				const mediaSubfolders = [
					"src/images",
				];

				// 3a. Local decap-server: POST /api/v1 with action "getMedia"
				if (
					init &&
					init.body &&
					typeof init.body === "string" &&
					init.body.indexOf('"getMedia"') !== -1
				) {
					try {
						const payload = JSON.parse(init.body);
						if (
							payload.action === "getMedia" &&
							payload.params &&
							(payload.params.mediaFolder === "src/images" ||
								payload.params.mediaFolder === "src/images/")
						) {
							const results = await Promise.all(
								mediaSubfolders.map((folder) => {
									const folderPayload = JSON.stringify({
										...payload,
										params: { ...payload.params, mediaFolder: folder },
									});
									return originalFetch(resource, {
										...init,
										body: folderPayload,
									})
										.then((res) => (res.ok ? res.json() : []))
										.catch(() => []);
								}),
							);
							const combined = [];
							const seen = new Set();
							for (let r = 0; r < results.length; r++) {
								const list = results[r];
								if (Array.isArray(list)) {
									for (let i = 0; i < list.length; i++) {
										const file = list[i];
										const key = file.id || file.path || file.name;
										if (key && !seen.has(key)) {
											seen.add(key);
											combined.push(file);
										}
									}
								}
							}
							return new Response(JSON.stringify(combined), {
								status: 200,
								statusText: "OK",
								headers: { "Content-Type": "application/json" },
							});
						}
					} catch (e) {
						console.warn("[Media Interceptor] getMedia parse error:", e);
					}
				}

				// 3b. Netlify Git Gateway: GET /.netlify/git/github/contents/src/images
				if (/\/\.netlify\/git\/github\/contents\/src(?:%2F|\/)images(?:\?|$)/i.test(url)) {
					try {
						const results = await Promise.all(
							mediaSubfolders.map((folder) => {
								const subUrl = url.replace(
									/\/contents\/src(?:%2F|\/)images/i,
									"/contents/" + encodeURIComponent(folder),
								);
								return originalFetch(subUrl, init)
									.then((res) => (res.ok ? res.json() : []))
									.catch(() => []);
							}),
						);
						const combined = [];
						const seen = new Set();
						for (let r = 0; r < results.length; r++) {
							const list = results[r];
							if (Array.isArray(list)) {
								for (let i = 0; i < list.length; i++) {
									const item = list[i];
									if (item && item.type === "file") {
										const key = item.path || item.sha || item.name;
										if (key && !seen.has(key)) {
											seen.add(key);
											combined.push(item);
										}
									}
								}
							}
						}
						return new Response(JSON.stringify(combined), {
							status: 200,
							statusText: "OK",
							headers: { "Content-Type": "application/json" },
						});
					} catch (e) {
						console.warn("[Media Interceptor] Git Gateway media error:", e);
					}
				}

				return originalFetch.apply(this, arguments);
			};
		})();
	</script>
</head>

<body>
	<script>
		// When running locally on localhost, check if the local Decap proxy server is active
		if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
			fetch("http://localhost:8081/api/v1")
				.catch(function () {
					var banner = document.createElement("div");
					banner.id = "local-cms-warning";
					banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:999999;background:#fff3cd;color:#856404;border-bottom:2px solid #ffeeba;padding:12px 16px;font-family:sans-serif;font-size:13px;line-height:1.4;box-shadow:0 2px 8px rgba(0,0,0,0.15);display:flex;align-items:center;justify-content:space-between;";
					banner.innerHTML = "<div><strong>Local CMS Proxy Not Detected!</strong> Decap CMS is in local mode. Please run <code>npm run cms</code> in your terminal to enable local editing without login.</div><button onclick=\"this.parentElement.remove()\" style=\"margin-left:16px;padding:4px 8px;background:#856404;color:#fff;border:none;border-radius:3px;cursor:pointer;font-weight:bold;\">✕</button>";
					if (document.body) {
						document.body.prepend(banner);
					} else {
						document.addEventListener("DOMContentLoaded", function () {
							document.body.prepend(banner);
						});
					}
				});
		}
	</script>
	<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
	<script>
		// 0. Patch Decap CMS's bundled Immutable.List.prototype.toString so that
		// collection list summaries render arrays (e.g. tags) cleanly as "post, fav"
		// instead of Immutable's debug format 'List [ "post", "fav" ]'
		(function () {
			function patchListProto(List) {
				if (!List || !List.prototype || List.prototype.__summaryPatched) return;
				List.prototype.__summaryPatched = true;
				List.prototype.toString = function () {
					return this.join(", ");
				};
			}

			if (window.webpackChunkDecapCms) {
				window.webpackChunkDecapCms.push([
					["decap-summary-list-patch-" + Date.now()],
					{},
					function (req) {
						try {
							if (typeof req === "function") {
								try {
									var mod = req(2002);
									if (mod && mod.List) patchListProto(mod.List);
								} catch (e) { }

								if (req.m) {
									var keys = Object.keys(req.m);
									for (var i = 0; i < keys.length; i++) {
										try {
											var m = req(keys[i]);
											if (m && m.List && m.Map) {
												patchListProto(m.List);
												break;
											}
										} catch (e) { }
									}
								}
							}
						} catch (err) {
							console.warn("[Decap Summary Patch] Error:", err);
						}
					},
				]);
			}
		})();

		// 1. Inject site stylesheet, Barlow Condensed, and Bebas Neue fonts into the preview iframe
		CMS.registerPreviewStyle(
			"https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&display=swap",
		);
		CMS.registerPreviewStyle("/assets/styles.css");

		/**
		 * Universal asset URL resolver for Decap CMS previews.
		 * Safely resolves unpublished local File objects (blob: URLs), AssetProxy objects, or path strings
		 * so newly uploaded or modified images render immediately in real time inside the preview iframe.
		 * 
		 * @param {Function} getAsset - Decap CMS asset resolver function.
		 * @param {string|object} val - The raw image value from entry data.
		 * @returns {string|null} Resolved image URL or null if empty.
		 */
		function resolveAssetUrl(getAsset, val) {
			if (!val) return null;
			if (
				typeof val === "string" &&
				(val.indexOf("blob:") === 0 || val.indexOf("data:") === 0)
			) {
				return val;
			}
			if (typeof val === "object" && val && val.fileObj) {
				try {
					return window.URL.createObjectURL(val.fileObj);
				} catch (e) { }
			}
			if (!getAsset) return typeof val === "string" ? val : null;
			try {
				var asset = getAsset(val);
				if (!asset) return typeof val === "string" ? val : null;
				if (asset.fileObj) {
					try {
						return window.URL.createObjectURL(asset.fileObj);
					} catch (e) { }
				}
				if (asset.url && typeof asset.url === "string") {
					return asset.url;
				}
				if (typeof asset.toString === "function") {
					var str = asset.toString();
					if (str && str !== "[object Object]") {
						return str;
					}
				}
			} catch (err) {
				console.warn("Asset resolve error:", err);
			}
			return typeof val === "string" ? val : null;
		}

		/**
		 * Resolves shortcut icons for the right sidebar outlinks preview.
		 * Detects platforms based on URL domain or label (e.g. GitHub, YouTube, LinkedIn, X, Discord).
		 * 
		 * @param {string} itemUrl - The bookmark destination URL.
		 * @param {string} itemLabel - The bookmark display text.
		 * @param {string} explicitIcon - Optional manual icon override from CMS.
		 * @returns {string} Clean icon identifier (e.g. "github", "safari").
		 */
		function resolveShortcutIcon(itemUrl, itemLabel, explicitIcon) {
			var normalizedExplicit = (explicitIcon || "").toLowerCase().trim();
			if (normalizedExplicit === "twitter") return "x";
			if (normalizedExplicit) return normalizedExplicit;

			var u = String(itemUrl || "").toLowerCase();
			var l = String(itemLabel || "").toLowerCase();

			if (u.indexOf("x.com") !== -1 || u.indexOf("twitter.com") !== -1 || l.indexOf("twitter") !== -1 || l === "x" || l.indexOf("x (") !== -1) {
				return "x";
			}
			if (u.indexOf("mailto:") === 0 || l.indexOf("email") !== -1 || l.indexOf("mail") !== -1) {
				return "mail";
			}
			if (u.indexOf("github.com") !== -1 || l.indexOf("github") !== -1) return "github";
			if (u.indexOf("youtube.com") !== -1 || l.indexOf("youtube") !== -1) return "youtube";
			if (u.indexOf("linkedin.com") !== -1 || l.indexOf("linkedin") !== -1) return "linkedin";
			if (u.indexOf("peerlist.io") !== -1 || l.indexOf("peerlist") !== -1) return "peerlist";
			if (u.indexOf("discord.com") !== -1 || l.indexOf("discord") !== -1) return "discord";
			if (u.indexOf("figma.com") !== -1 || l.indexOf("figma") !== -1) return "figma";
			if (u.indexOf("instagram.com") !== -1 || l.indexOf("instagram") !== -1) return "instagram";
			if (u.indexOf("dev.to") !== -1 || l.indexOf("dev.to") !== -1) return "dev.to";
			if (u.indexOf("hashnode") !== -1 || l.indexOf("hashnode") !== -1) return "hashnode";
			if (u.indexOf("medium.com") !== -1 || l.indexOf("medium") !== -1) return "medium";
			if (u.indexOf("masterji") !== -1 || l.indexOf("masterji") !== -1) return "masterji";
			if (u.indexOf("steam") !== -1 || l.indexOf("steam") !== -1) return "steam";
			if (u.indexOf("spotify") !== -1 || l.indexOf("spotify") !== -1) return "spotify";

			return "safari";
		}

		/**
		 * Renders the full retro 2007 website shell around CMS preview content.
		 * Replicates the complete production layout:
		 * - Optional top announcement banner with alert/info/success styling
		 * - CRT monitors header banner and typography
		 * - Top navigation bar with breadcrumb trail
		 * - Left sidebar (avatar, navigation links, recent posts, favorites)
		 * - Center article section with preview content
		 * - Right sidebar (outlinks/shortcuts, currently reading, games, software, friends)
		 * - Site footer with copyright and sitemap links
		 * 
		 * @param {string} headerTagline - Subtitle tagline for the header banner.
		 * @param {string} pageTitle - Main <h1> title for the header.
		 * @param {React.ReactNode} contentChildren - Body content to render inside the center column.
		 * @param {string} activeNavKey - Identifier of the active top-level nav link ("home", "about", etc.).
		 * @param {Array<object>} breadcrumbs - Location breadcrumb items.
		 * @param {string} headerBannerSrc - Header banner image background URL.
		 * @param {object} announcement - Optional announcement banner override object.
		 * @param {object} customSidebarOptions - Optional sidebar widget limits and titles overrides.
		 * @returns {React.ReactElement} The full site shell virtual DOM element.
		 */
		function renderFullSiteShell(
			headerTagline,
			pageTitle,
			contentChildren,
			activeNavKey,
			breadcrumbs,
			headerBannerSrc,
			announcement,
			customSidebarOptions,
		) {
			var navItems = [
				{ key: "home", label: "home", url: "/" },
				{ key: "about", label: "about", url: "/about/" },
				{ key: "portfolio", label: "portfolio", url: "/portfolio/" },
				{ key: "blog", label: "blog", url: "/blog/" },
				{ key: "resume", label: "resume", url: "/resume/" },
			];

			var navElements = [];
			navItems.forEach(function (item, idx) {
				if (idx > 0) {
					navElements.push(
						h(
							"span",
							{
								key: "sep-" + idx,
								className:
									"px-0.5 sm:px-1 text-[#8aa2af] shrink-0 text-[10px] sm:text-xs select-none",
							},
							"|",
						),
					);
				}
				var isActive = activeNavKey === item.key;
				navElements.push(
					h(
						"a",
						{
							key: item.key,
							className:
								"site-nav-link shrink-0 px-1.5 sm:px-2 py-0.5 " +
								(isActive
									? "bg-[#164b70] text-white font-bold shadow-[inset_0_1px_2px_rgba(0,0,0,0.35)] no-underline"
									: "text-[#064f83] underline hover:text-[#c0392b] hover:bg-[#dce9f0]"),
							href: item.url,
						},
						item.label,
					),
				);
			});

			var breadcrumbElements = null;
			if (activeNavKey !== "home" && breadcrumbs && breadcrumbs.length) {
				var bcChildren = [
					h(
						"span",
						{ key: "loc-label", className: "font-bold text-[#164b70]" },
						"Location:",
					),
					h(
						"a",
						{
							key: "bc-home",
							className: "text-[#064f83] underline hover:text-[#c0392b]",
							href: "/",
						},
						"home",
					),
					h("span", { key: "bc-sep-0", className: "text-[#8aa2af]" }, ">"),
				];
				breadcrumbs.forEach(function (crumb, cIdx) {
					if (cIdx > 0) {
						bcChildren.push(
							h(
								"span",
								{ key: "bc-sep-" + (cIdx + 1), className: "text-[#8aa2af]" },
								">",
							),
						);
					}
					if (crumb.url && cIdx < breadcrumbs.length - 1) {
						bcChildren.push(
							h(
								"a",
								{
									key: "bc-" + cIdx,
									className: "text-[#064f83] underline hover:text-[#c0392b]",
									href: crumb.url,
								},
								crumb.label,
							),
						);
					} else {
						bcChildren.push(
							h(
								"span",
								{ key: "bc-" + cIdx, className: "font-bold text-[#164b70]" },
								crumb.label,
							),
						);
					}
				});
				breadcrumbElements = h(
					"div",
					{
						className:
							"site-nav-breadcrumbs flex flex-wrap items-center justify-center gap-1.5 border-t border-[#c6d7e0] bg-[#edf4f7] px-5 py-1 text-[14px] text-[#536a75] shadow-[inset_0_1px_0_#fff]",
					},
					bcChildren,
				);
			}

			var leftSidebarItems = (customSidebarOptions && customSidebarOptions.leftSidebar && customSidebarOptions.leftSidebar.items)
				? customSidebarOptions.leftSidebar.items
				: navItems;
			var leftSidebarTitle = (customSidebarOptions && customSidebarOptions.leftSidebar && customSidebarOptions.leftSidebar.title) || "Navigate";
			var navLimit = (customSidebarOptions && customSidebarOptions.sidebarWidgets && Number(customSidebarOptions.sidebarWidgets.navigationLimit)) || (customSidebarOptions && customSidebarOptions.leftSidebar && Number(customSidebarOptions.leftSidebar.limit)) || 0;
			if (navLimit > 0) {
				leftSidebarItems = leftSidebarItems.slice(0, navLimit);
			}

			var sidebarLinks = leftSidebarItems.map(function (item, idx) {
				var itemKey = item.key || item.label || ("nav-" + idx);
				var isActive = activeNavKey === itemKey || (item.url === "/" && activeNavKey === "home") || (item.url && activeNavKey && item.url.indexOf("/" + activeNavKey + "/") !== -1);
				return h(
					"p",
					{ key: "side-" + itemKey },
					isActive
						? h(
							"span",
							{
								className:
									"inline-block bg-[#164b70] text-white font-bold px-1.5 py-0.5 text-[14px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.3)]",
							},
							item.label,
						)
						: h(
							"a",
							{
								className: "text-[#064f83] underline hover:text-[#c0392b]",
								href: item.url || "#",
							},
							item.label,
						),
				);
			});

			var announcementBar = null;
			var ann = announcement !== undefined ? announcement : {
				enabled: true,
				type: "info",
				message: "Welcome to my portfolio! Check out the newly updated retro workspace & books.",
				linkText: "Check it out »",
				linkUrl: "/about/books/"
			};
			if (ann && ann.enabled && ann.message) {
				var badgeText = ann.type === "alert" ? "NOTICE" : ann.type === "success" ? "UPDATE" : "BULLETIN";
				var barClass = "mb-1 border px-3 py-1.5 flex items-center justify-between gap-3 text-xs shadow-[0_1px_3px_rgba(0,0,0,0.1)] " +
					(ann.type === "alert" ? "border-[#d4a017] bg-[#fff8e1] text-[#5d4037]" : ann.type === "success" ? "border-[#66bb6a] bg-[#e8f5e9] text-[#1b5e20]" : "border-[#789bb0] bg-[#e6f2f8] text-[#164b70]");
				var badgeClass = "font-bold uppercase tracking-wider text-[10px] px-1.5 py-0.5 border select-none shrink-0 " +
					(ann.type === "alert" ? "border-[#d4a017] bg-[#ffecb3] text-[#795548]" : ann.type === "success" ? "border-[#66bb6a] bg-[#c8e6c9] text-[#2e7d32]" : "border-[#789bb0] bg-[#d0e5f2] text-[#164b70]");

				announcementBar = h(
					"aside",
					{ className: barClass },
					h(
						"div",
						{ className: "flex items-center gap-2 min-w-0" },
						h("span", { className: badgeClass }, badgeText),
						h("span", { className: "truncate font-medium text-xs" }, ann.message),
						ann.linkUrl && ann.linkText
							? h("a", { className: "shrink-0 underline font-bold hover:text-[#c0392b] ml-1", href: ann.linkUrl }, ann.linkText)
							: null,
					),
					h("span", { className: "px-1.5 py-0.5 border border-[#9bb0be] bg-white text-[10px] font-bold text-[#71828b] select-none" }, "✕"),
				);
			}

			return h(
				"div",
				{
					className:
						"site-body min-h-screen px-2 py-6 font-['Barlow_Condensed',sans-serif] text-[#222]",
				},
				h(
					"main",
					{ className: "site-shell mx-auto max-w-6xl p-1" },
					announcementBar,

					// Header with CRT monitors banner
					h(
						"header",
						{ className: "site-header relative overflow-hidden text-white" },
						h("img", {
							className:
								"site-header-banner absolute inset-0 h-full w-full object-cover",
							src: headerBannerSrc || "/images/header-banner.jpg",
							alt: "",
						}),
						h(
							"div",
							{ className: "relative px-5 py-4" },
							h(
								"p",
								{
									className:
										"text-center text-xs tracking-[0.2em] text-[#b8d9e8]",
								},
								headerTagline || "MY WEB LOG",
							),
							h(
								"h1",
								{
									className: "mt-1 text-center tracking-tight",
								},
								pageTitle || "Amitendu Bikash Dhusiya",
							),
						),
					),

					// Navigation bar with active link background & breadcrumbs
					h(
						"nav",
						{ className: "site-nav text-xs" },
						h(
							"div",
							{
								className:
									"site-nav-links flex flex-nowrap items-center justify-center gap-0.5 sm:gap-1 px-1 sm:px-5 py-1 text-[11px] sm:text-xs overflow-x-auto whitespace-nowrap [scrollbar-width:none]",
							},
							navElements,
						),
						breadcrumbElements,
					),

					// 3 Columns: Left Sidebar, Main Content, Right Sidebar
					h(
						"div",
						{ className: "site-columns" },
						// Left Sidebar
						h(
							"aside",
							{ className: "site-sidebar site-sidebar-left" },
							h(
								"div",
								{ className: "site-sidebar-card mb-4" },
								h(
									"div",

		// ==========================================
		// 4.2 AUTOMATIC IMAGE RENAMER (TO CONTENT SLUG)
		// ==========================================
		(function initImageRenamer() {
			function slugify(text) {
				return String(text || "")
					.toLowerCase()
					.trim()
					.replace(/^[0-9]{4}-[0-9]{2}-[0-9]{2}-/, "")
					.replace(/[^a-z0-9]+/g, "-")
					.replace(/^-+|-+$/g, "");
			}

			function getCleanSlug() {
				// 1. Check if editing inside an item card (e.g. books, movies, games, gear, software)
				var activeEl = document.activeElement;
				if (activeEl) {
					var itemCard = activeEl.closest(
						'[class*="ListItem"], [class*="Card"], [class*="ControlPane"]',
					);
					if (itemCard) {
						var cardTitle = itemCard.querySelector(
							'input[id*="title"], input[id*="heading"], input[id*="name"]',
						);
						if (cardTitle && cardTitle.value) {
							return slugify(cardTitle.value);
						}
					}
				}

				// 2. Check top-level title / heading inputs in active form
				var mainTitle = document.querySelector(
					'input[id^="title-field-"], input[id^="heading-field-"], input[id^="name-field-"]',
				);
				if (mainTitle && mainTitle.value) {
					return slugify(mainTitle.value);
				}

				// 3. Check URL hash (e.g. #/collections/blog/entries/2026-05-04-hello-world)
				var hash = window.location.hash || "";
				var hashMatch = hash.match(/\/entries\/([^/?#]+)/);
				if (hashMatch && hashMatch[1]) {
					return slugify(decodeURIComponent(hashMatch[1]));
				}

				return null;
			}

			// Intercept file input change events
			document.addEventListener(
				"change",
				function (e) {
					var input = e.target;
					if (
						!input ||
						input.type !== "file" ||
						!input.files ||
						input.files.length === 0
					)
						return;
					if (input.dataset.renamed === "true") return;

					var slug = getCleanSlug();
					if (!slug) return;

					try {
						var dt = new DataTransfer();
						var hasChanges = false;

						for (var i = 0; i < input.files.length; i++) {
							var file = input.files[i];
							var ext = file.name.split(".").pop().toLowerCase() || "webp";
							var suffix = input.files.length > 1 ? "-" + (i + 1) : "";
							var newName = slug + suffix + "." + ext;

							if (file.name !== newName) {
								var renamedFile = new File([file], newName, {
									type: file.type,
									lastModified: file.lastModified,
								});
								dt.items.add(renamedFile);
								hasChanges = true;
								console.log(
									"[Decap Image Renamer] Renamed: " +
									file.name +
									" -> " +
									newName,
								);
							} else {
								dt.items.add(file);
							}
						}

						if (hasChanges) {
							input.dataset.renamed = "true";
							input.files = dt.files;
							input.dispatchEvent(new Event("change", { bubbles: true }));
							setTimeout(function () {
								input.dataset.renamed = "false";
							}, 500);
						}
					} catch (err) {
						console.warn("[Decap Image Renamer] Auto-rename skipped:", err);
					}
				},
				true,
			);
		})();

		CMS.registerEventListener({

			handler: function (ctx) {
				var entry = ctx.entry;
				var data = entry.get("data");

				// Trim titles and headings
				if (data.has("title") && typeof data.get("title") === "string") {
					data = data.set("title", data.get("title").trim());
				}
				if (data.has("heading") && typeof data.get("heading") === "string") {
					data = data.set("heading", data.get("heading").trim());
				}

				// Blog entries:
				if (entry.get("collection") === "blog") {
					var isExisting =
						entry.get("isNew") === false ||
						(data.get("date") && !entry.get("isNew"));
					if (isExisting) {
						// Item 20: On preSave for blog entries, set updated to current date when entry already exists
						data = data.set("updated", new Date().toISOString());
					}
					// Ensure blog entries always have a publish date
					if (!data.get("date")) {
						data = data.set("date", new Date().toISOString());
					}
				}

				return data;
			},
		});
	</script>
</body>

</html>
