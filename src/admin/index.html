<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      // 1. Inject site stylesheet and Bebas Neue font into the preview iframe
      CMS.registerPreviewStyle("https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap");
      CMS.registerPreviewStyle("/assets/styles.css");

      // Helper function to render the full site shell (header banner, nav, sidebars, footer)
      function renderFullSiteShell(headerTagline, pageTitle, contentChildren) {
        return h('div', { className: 'site-body min-h-screen px-2 py-6 font-[Verdana,Tahoma,sans-serif] text-[#222]' },
          h('main', { className: 'site-shell mx-auto max-w-6xl p-1' },
            // Header with CRT monitors banner
            h('header', { className: 'site-header relative overflow-hidden text-white' },
              h('img', { className: 'site-header-banner absolute inset-0 h-full w-full object-cover', src: '/images/header-banner.jpg', alt: '' }),
              h('div', { className: 'relative px-5 py-4' },
                h('p', { className: 'text-center text-xs tracking-[0.2em] text-[#b8d9e8]' }, headerTagline || 'MY WEB LOG'),
                h('h1', { className: 'mt-1 text-center font-[Trebuchet_MS,Verdana,sans-serif] text-2xl tracking-tight' }, pageTitle || 'Shadow Amitendu')
              )
            ),

            // Navigation bar
            h('nav', { className: 'site-nav px-5 py-2 text-xs' },
              h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/' }, 'home'),
              h('span', { className: 'px-2 text-[#8aa2af]' }, '|'),
              h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/about/' }, 'about'),
              h('span', { className: 'px-2 text-[#8aa2af]' }, '|'),
              h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/portfolio/' }, 'portfolio'),
              h('span', { className: 'px-2 text-[#8aa2af]' }, '|'),
              h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/blog/' }, 'blog')
            ),

            // 3 Columns: Left Sidebar, Main Content, Right Sidebar
            h('div', { className: 'site-columns' },
              // Left Sidebar
              h('aside', { className: 'site-sidebar site-sidebar-left' },
                h('h2', null, 'Navigate'),
                h('p', null, h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/' }, 'home')),
                h('p', null, h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/about/' }, 'about')),
                h('p', null, h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/blog/' }, 'blog')),
                h('p', null, h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/portfolio/' }, 'portfolio'))
              ),

              // Main Article / Content
              h('section', { className: 'site-content px-5 py-6 text-sm leading-6' },
                contentChildren
              ),

              // Right Sidebar
              h('aside', { className: 'site-sidebar site-sidebar-right' },
                h('h2', null, 'Elsewhere'),
                h('p', null, h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: 'https://github.com/' }, 'GitHub')),
                h('p', null, h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: 'mailto:hello@example.com' }, 'Email'))
              )
            ),

            // Footer
            h('footer', { className: 'site-footer px-5 py-4 text-center text-[11px] text-[#71828b]' },
              h('p', { className: 'font-bold text-[#164b70]' }, 'Thanks for stopping by!'),
              h('p', { className: 'mt-1' }, '© ' + new Date().getFullYear() + ' Shadow Amitendu. All rights reserved.'),
              h('p', { className: 'mt-2' },
                h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/' }, 'home'),
                h('span', { className: 'px-1' }, '·'),
                h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/about/' }, 'about'),
                h('span', { className: 'px-1' }, '·'),
                h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/blog/' }, 'blog'),
                h('span', { className: 'px-1' }, '·'),
                h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/portfolio/' }, 'portfolio')
              ),
              h('p', { className: 'mt-2 text-[10px]' }, 'Last updated: ' + new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }))
            )
          )
        );
      }

      // 2. Custom Blog Post Preview in Full Site Shell
      var BlogPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']) || 'Untitled Post';
          var headerTagline = entry.getIn(['data', 'headerTagline']) || 'BLOG POST';
          var date = entry.getIn(['data', 'date']);
          var author = entry.getIn(['data', 'author']) || 'Shadow Amitendu';
          var description = entry.getIn(['data', 'description']);
          var rawImage = entry.getIn(['data', 'image']);
          var image = rawImage ? this.props.getAsset(rawImage) : null;
          var body = this.props.widgetFor('body');

          var formattedDate = date ? new Date(date).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          }) : 'Draft';

          var articleContent = h('article', { className: 'site-entry' },
            // Header
            h('header', { className: 'site-entry-header border border-[#b2c2cc] bg-gradient-to-b from-[#f8fbfc] to-[#dce8ee] p-3.5 shadow-[inset_0_1px_0_#fff]' },
              h('div', { className: 'flex flex-wrap items-center justify-between gap-2 text-[11px] text-[#536a75]' },
                h('div', { className: 'flex items-center gap-2' },
                  h('span', { className: 'inline-block bg-[#164b70] px-1.5 py-0.5 text-[9px] font-bold tracking-wider text-white uppercase' }, 'ENTRY'),
                  h('time', { className: 'font-bold text-[#164b70]' }, formattedDate)
                ),
                h('div', { className: 'text-[11px]' }, 'written by ',
                  h('span', { className: 'font-bold text-[#164b70]' }, author)
                )
              ),
              h('h2', { className: 'mt-2 text-xl font-bold tracking-tight text-[#164b70]' }, title),
              description ? h('p', { className: 'mt-1 text-xs italic text-[#71828b]' }, description) : null
            ),

            // Featured image
            image ? h('div', { className: 'site-entry-image-frame my-4 border border-[#7892a3] bg-white p-1 shadow-[2px_2px_0_#b8c5cc]' },
              h('img', { className: 'h-auto w-full object-contain', src: image.toString(), alt: title })
            ) : null,

            // Body
            h('div', { className: 'site-entry-body mt-4 text-sm leading-relaxed text-[#26343d]' }, body)
          );

          return renderFullSiteShell(headerTagline, title, articleContent);
        }
      });

      CMS.registerPreviewTemplate('blog', BlogPreview);

      // 3. Custom Portfolio Preview in Full Site Shell
      var PortfolioPreview = createClass({
        render: function() {
          var entry = this.props.entry;
          var title = entry.getIn(['data', 'title']) || 'Untitled Project';
          var headerTagline = entry.getIn(['data', 'headerTagline']) || 'PORTFOLIO PROJECT';
          var description = entry.getIn(['data', 'description']);
          var rawImage = entry.getIn(['data', 'image']);
          var image = rawImage ? this.props.getAsset(rawImage) : null;
          var body = this.props.widgetFor('body');

          var portfolioContent = h('div', null,
            h('p', { className: 'text-xs text-[#71828b]' }, 'portfolio / project'),
            h('h2', { className: 'mt-2 border-b border-[#b7cbd6] pb-1 text-lg font-bold text-[#164b70]' }, title),
            description ? h('p', { className: 'mt-2 text-sm italic text-[#536a75]' }, description) : null,
            image ? h('div', { className: 'site-entry-image-frame my-4 border border-[#7892a3] bg-white p-1 shadow-[2px_2px_0_#b8c5cc]' },
              h('img', { className: 'h-auto w-full object-contain', src: image.toString(), alt: title })
            ) : null,
            h('div', { className: 'site-content text-sm leading-relaxed mt-4' }, body),
            h('p', { className: 'mt-6' },
              h('a', { className: 'text-[#064f83] underline hover:text-[#c0392b]', href: '/portfolio/' }, '← back to portfolio')
            )
          );

          return renderFullSiteShell(headerTagline, title, portfolioContent);
        }
      });

      CMS.registerPreviewTemplate('portfolio', PortfolioPreview);
    </script>
  </body>
</html>
