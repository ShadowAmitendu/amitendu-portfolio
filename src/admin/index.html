	<body>
		<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
		<script>
			// 1. Inject site stylesheet, Barlow Condensed, and Bebas Neue fonts into the preview iframe
			CMS.registerPreviewStyle(
				"https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&display=swap",
			);
			CMS.registerPreviewStyle("/assets/styles.css");

			// Universal asset URL resolver for Decap CMS previews
			// Resolves unpublished local File objects (blob URLs), AssetProxy, or path strings
			function resolveAssetUrl(getAsset, val) {
				if (!val) return null;
				if (
					typeof val === "string" &&
					(val.indexOf("blob:") === 0 || val.indexOf("data:") === 0)
				) {
					return val;
				}
				if (typeof val === "object" && val && val.fileObj) {
					try {
						return window.URL.createObjectURL(val.fileObj);
					} catch (e) {}
				}
				if (!getAsset) return typeof val === "string" ? val : null;
				try {
					var asset = getAsset(val);
					if (!asset) return typeof val === "string" ? val : null;
					if (asset.fileObj) {
						try {
							return window.URL.createObjectURL(asset.fileObj);
						} catch (e) {}
					}
					if (asset.url && typeof asset.url === "string") {
						return asset.url;
					}
					if (typeof asset.toString === "function") {
						var str = asset.toString();
						if (str && str !== "[object Object]") {
							return str;
						}
					}
				} catch (err) {
					console.warn("Asset resolve error:", err);
				}
				return typeof val === "string" ? val : null;
			}

			// Helper function to render the full site shell (header banner, nav, sidebars, footer)
			function renderFullSiteShell(
				headerTagline,
				pageTitle,
				contentChildren,
				activeNavKey,
				breadcrumbs,
				headerBannerSrc,
			) {
				var navItems = [
					{ key: "home", label: "home", url: "/" },
					{ key: "about", label: "about", url: "/about/" },
					{ key: "portfolio", label: "portfolio", url: "/portfolio/" },
					{ key: "blog", label: "blog", url: "/blog/" },
					{ key: "resume", label: "resume", url: "/resume/" },
				];

				var navElements = [];
				navItems.forEach(function (item, idx) {
					if (idx > 0) {
						navElements.push(
							h(
								"span",
								{
									key: "sep-" + idx,
									className:
										"px-0.5 sm:px-1 text-[#8aa2af] shrink-0 text-[10px] sm:text-xs select-none",
								},
								"|",
							),
						);
					}
					var isActive = activeNavKey === item.key;
					navElements.push(
						h(
							"a",
							{
								key: item.key,
								className:
									"site-nav-link shrink-0 px-1.5 sm:px-2 py-0.5 " +
									(isActive
										? "bg-[#164b70] text-white font-bold shadow-[inset_0_1px_2px_rgba(0,0,0,0.35)] no-underline"
										: "text-[#064f83] underline hover:text-[#c0392b] hover:bg-[#dce9f0]"),
								href: item.url,
							},
							item.label,
						),
					);
				});

				var breadcrumbElements = null;
				if (activeNavKey !== "home" && breadcrumbs && breadcrumbs.length) {
					var bcChildren = [
						h(
							"span",
							{ key: "loc-label", className: "font-bold text-[#164b70]" },
							"Location:",
						),
						h(
							"a",
							{
								key: "bc-home",
								className: "text-[#064f83] underline hover:text-[#c0392b]",
								href: "/",
							},
							"home",
						),
						h("span", { key: "bc-sep-0", className: "text-[#8aa2af]" }, ">"),
					];
					breadcrumbs.forEach(function (crumb, cIdx) {
						if (cIdx > 0) {
							bcChildren.push(
								h(
									"span",
									{ key: "bc-sep-" + (cIdx + 1), className: "text-[#8aa2af]" },
									">",
								),
							);
						}
						if (crumb.url && cIdx < breadcrumbs.length - 1) {
							bcChildren.push(
								h(
									"a",
									{
										key: "bc-" + cIdx,
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: crumb.url,
									},
									crumb.label,
								),
							);
						} else {
							bcChildren.push(
								h(
									"span",
									{ key: "bc-" + cIdx, className: "font-bold text-[#164b70]" },
									crumb.label,
								),
							);
						}
					});
					breadcrumbElements = h(
						"div",
						{
							className:
								"site-nav-breadcrumbs flex flex-wrap items-center justify-center gap-1.5 border-t border-[#c6d7e0] bg-[#edf4f7] px-5 py-1 text-[14px] text-[#536a75] shadow-[inset_0_1px_0_#fff]",

				var sidebarLinks = navItems.map(function (item) {

					return h(

						{ key: "side-" + item.key },

												alt: "",
												width: 20,
												height: 20,
											}),
											h("span", { className: "underline" }, "GitHub"),
										),
									),
									h(
										"div",
										null,
										h(
											"a",
											{
												className:
													"flex items-center gap-2 text-[#064f83] hover:text-[#c0392b]",
												href: "https://www.youtube.com/@ShadowAmitendu",
											},
											h("img", {
												className:
													"site-macos-icon h-5 w-5 shrink-0 rounded-[4.5px] shadow-[0_1px_2px_rgba(0,0,0,0.25)]",
												src: "/assets/icons/macos-youtube.png",
												alt: "",
												width: 20,
												height: 20,
											}),
											h("span", { className: "underline" }, "YouTube"),
										),
									),
								),
							),
						),

						// Footer
						h(
							"footer",
							{
								className:
									"site-footer px-5 py-4 text-center text-[14px] text-[#71828b]",
							},
							h(
								"p",
								{ className: "font-bold text-[#164b70]" },
								"Thanks for stopping by!",
							),
							h(
								"p",
								{ className: "mt-1" },
								"© " +
									new Date().getFullYear() +
									" Amitendu Bikash Dhusiya. All rights reserved.",
							),
							h(
								"p",
								{ className: "mt-2" },
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/",
									},
									"home",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/about/",
									},
									"about",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/blog/",
									},
									"blog",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/portfolio/",
									},
									"portfolio",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/resume/",
									},
									"resume",
								),
							),
							h(
								"p",
								{ className: "mt-2 text-[10px]" },
								"Last updated: " +
									new Date().toLocaleDateString("en-US", {
										month: "short",
										day: "numeric",
										year: "numeric",
									}),
							),
						),
					),
				);
			}

			// 2. Custom Blog Post Preview in Full Site Shell
			var BlogPreview = createClass({
				render: function () {
					var entry = this.props.entry;
					var title = entry.getIn(["data", "title"]) || "Untitled Post";
					var headerTagline =
						entry.getIn(["data", "headerTagline"]) || "BLOG POST";
					var date = entry.getIn(["data", "date"]);
					var author =
						entry.getIn(["data", "author"]) || "Amitendu Bikash Dhusiya";
					var description = entry.getIn(["data", "description"]);
					var rawImage = entry.getIn(["data", "image"]);
					var imageSrc = resolveAssetUrl(this.props.getAsset, rawImage);
					var body = this.props.widgetFor("body");
					var tags = entry.getIn(["data", "tags"]);
					var isDraft =
						entry.getIn(["data", "draft"]) ||
						(tags &&
							(typeof tags === "string"
								? tags === "draft"
								: tags.includes
									? tags.includes("draft")
									: false));

					var formattedDate = date
						? new Date(date).toLocaleDateString("en-US", {
								month: "short",
								day: "numeric",
								year: "numeric",
							})
						: "Draft";

					var articleContent = h(
						"article",
						{ className: "site-entry" },
						// Header (Merged hero card)
						h(
							"header",
							{
								className:
									"site-entry-header border border-[#b2c2cc] bg-white shadow-[2px_2px_0_#cad6de] overflow-hidden",
							},
							// 1. Entry date & written by: name
							h(
								"div",
								{
									className:
										"border-b border-[#c6d7e0] bg-gradient-to-b from-[#f8fbfc] to-[#dce8ee] px-3.5 py-2 flex flex-wrap items-center justify-between gap-2 text-[13px] sm:text-[14px] text-[#536a75] shadow-[inset_0_1px_0_#fff]",
								},
								h(
									"div",
									{ className: "flex items-center gap-2" },
									h(
										"span",
										{
											className:
												"inline-block bg-[#164b70] px-1.5 py-0.5 text-[9px] font-bold tracking-wider text-white uppercase select-none",
										},
										"ENTRY",
									),
									isDraft
										? h(
												"span",
												{
													className:
														"inline-block bg-[#d97706] px-1.5 py-0.5 text-[9px] font-bold tracking-wider text-white uppercase select-none",
												},
												"DRAFT",

										: null,
									h(

										{ className: "font-bold text-[#164b70]" },
										formattedDate,

								),
								h(

										? [
												"written by: ",
												h(

													{
														key: "author",
														className: "font-bold text-[#164b70]",
													},
													author,
												),
											]
										: null,
								),
							),
							// 2. Image with Title Overlaid (or standard title if no image)

								? h(
										"div",
										{
											className:
												"site-entry-hero relative bg-[#0a1926] border-b border-[#c6d7e0] overflow-hidden group",
										},
										h("img", {
											className:
												"block w-full h-auto max-h-[540px] object-cover sm:object-contain mx-auto",
											src: imageSrc,
											alt: title,
										}),
										h(
											"div",
											{

													"site-entry-hero-overlay absolute inset-x-0 bottom-0 bg-gradient-to-t from-[#0a1f2e] from-55% via-[#0a1f2e]/85 to-transparent pt-16 pb-3.5 px-4 sm:px-5 pointer-events-none",

													style: { color: "#ffffff" },

								: h(

																"Notes:",
															),
															h(
																"td",
																{
																	className:
																		"py-1 text-[#26343d] leading-relaxed italic",
																},
																'"' + item.description + '"',
															),
														)
													: null,
											),
										),
										item.url
											? h(
													"div",
													{ className: "pt-2 flex justify-end" },
													h(
														"span",
														{
															className:
																"site-button-2007 inline-block px-3 py-1 text-xs",
														},
														"Visit Homepage »",
													),
												)
											: null,
									),
								),
							);
						});
					}

					var friendsContent = h(
						"div",
						null,
						renderInPageSubnav("friends"),
						h(
							"h2",
							{
								className:
									"border-b border-[#b7cbd6] pb-1 text-lg font-bold text-[#164b70]",
							},
							heading,
						),
						intro
							? h(
									"p",
									{ className: "mt-3 text-sm leading-relaxed text-[#26343d]" },
									intro,
								)
							: null,
						h("div", { className: "mt-4 space-y-3" }, itemsListElements),
						h(
							"p",
							{ className: "mt-6" },
							h(
								"span",
								{ className: "text-[#064f83] underline" },
								"← back to home",
							),
						),
					);

					return renderMainContentContainer(friendsContent);
				},
			});

			var AboutSectionRouter = createClass({
				render: function () {
					var entry = this.props.entry;
					var file = entry.get("file") || "";
					var slug = entry.get("slug") || "";

					if (file.indexOf("books.json") !== -1 || slug === "about-books") {
						return h(AboutBooksPreview, this.props);
					}
					if (file.indexOf("movies.json") !== -1 || slug === "about-movies") {
						return h(AboutMoviesPreview, this.props);
					}
					if (file.indexOf("games.json") !== -1 || slug === "about-games") {
						return h(AboutGamesPreview, this.props);
					}
					if (
						file.indexOf("software.json") !== -1 ||
						slug === "about-software"
					) {
						return h(AboutSoftwarePreview, this.props);
					}
					if (file.indexOf("friends.json") !== -1 || slug === "about-friends") {
						return h(AboutFriendsPreview, this.props);
					}
					return h(AboutMePreview, this.props);
				},
			});

			CMS.registerPreviewTemplate("about-section", AboutSectionRouter);
			CMS.registerPreviewTemplate("about-me", AboutMePreview);
			CMS.registerPreviewTemplate("about-books", AboutBooksPreview);
			CMS.registerPreviewTemplate("about-movies", AboutMoviesPreview);
			CMS.registerPreviewTemplate("about-games", AboutGamesPreview);
			CMS.registerPreviewTemplate("about-software", AboutSoftwarePreview);
			CMS.registerPreviewTemplate("about-friends", AboutFriendsPreview);
			CMS.registerPreviewTemplate("about-page", AboutMePreview);

			// 7. Custom Blog Landing Page Preview in Full Site Shell
			var BlogPagePreview = createClass({
				render: function () {
					var entry = this.props.entry;
					var title = entry.getIn(["data", "title"]) || "Blog";
					var headerTagline =
						entry.getIn(["data", "headerTagline"]) || "MY WEB LOG";
					var heading = entry.getIn(["data", "heading"]) || "Web log";
					var intro =
						entry.getIn(["data", "intro"]) ||
						"Notes from my corner of the web.";

					var blogPageContent = h(
						"div",
						null,
						h(
							"h2",
							{
								className:
									"border-b border-[#b7cbd6] pb-1 text-lg font-bold text-[#164b70]",
							},
							heading,
						),
						h("p", { className: "mt-3" }, intro),
						h(
							"div",
							{
								className:
									"mt-6 border border-[#b7cbd6] bg-[#f4f8fa] p-4 text-center text-xs text-[#71828b] shadow-[inset_0_1px_0_#fff]",
							},
							h(
								"p",
								{ className: "font-bold text-sm text-[#164b70]" },
								"Blog Landing Page Preview",
							),
							h(
								"p",
								{ className: "mt-1" },
								"Published blog posts will appear here dynamically in reverse chronological order.",
							),
						),
					);

					var rawHeaderBanner = entry.getIn(["data", "headerBanner"]);
					var headerBannerSrc = resolveAssetUrl(
						this.props.getAsset,
						rawHeaderBanner,
					);

					return renderFullSiteShell(
						headerTagline,
						title,
						blogPageContent,
						"blog",
						[{ label: "blog" }],
						headerBannerSrc,
					);
				},
			});
			CMS.registerPreviewTemplate("blog-page", BlogPagePreview);

			// 8. Custom Portfolio Landing Page Preview in Full Site Shell
			var PortfolioPagePreview = createClass({
				render: function () {
					var entry = this.props.entry;
					var title = entry.getIn(["data", "title"]) || "Portfolio";
					var headerTagline =
						entry.getIn(["data", "headerTagline"]) || "MY WEB PORTFOLIO";
					var heading = entry.getIn(["data", "heading"]) || "My work";
					var intro =
						entry.getIn(["data", "intro"]) ||
						"A few things I have made on the internet.";

					var portfolioPageContent = h(
						"div",
						null,
						h(
							"h2",
							{
								className:
									"border-b border-[#b7cbd6] pb-1 text-lg font-bold text-[#164b70]",
							},
							heading,
						),
						h("p", { className: "mt-3" }, intro),
						h(
							"div",
							{
								className:
									"mt-6 border border-[#b7cbd6] bg-[#f4f8fa] p-4 text-center text-xs text-[#71828b] shadow-[inset_0_1px_0_#fff]",
							},
							h(
								"p",
								{ className: "font-bold text-sm text-[#164b70]" },
								"Portfolio Landing Page Preview",
							),
							h(
								"p",
								{ className: "mt-1" },
								"Published portfolio projects will appear here dynamically.",
							),
						),
					);

					var rawHeaderBanner = entry.getIn(["data", "headerBanner"]);
					var headerBannerSrc = resolveAssetUrl(
						this.props.getAsset,
						rawHeaderBanner,
					);

					return renderFullSiteShell(
						headerTagline,
						title,
						portfolioPageContent,
						"portfolio",
						[{ label: "portfolio" }],
						headerBannerSrc,
					);
				},
			});
			CMS.registerPreviewTemplate("portfolio-page", PortfolioPagePreview);

			// 9. Custom Author Profile Preview in Full Site Shell
			var AuthorPreview = createClass({
				render: function () {
					var entry = this.props.entry;
					var name = entry.getIn(["data", "name"]) || "Author";
					var rawImage = entry.getIn(["data", "image"]);
					var imageSrc = resolveAssetUrl(this.props.getAsset, rawImage);
					var bio = entry.getIn(["data", "bio"]) || "";

					var authorContent = h(
						"div",
						null,
						h(
							"h2",
							{
								className:
									"border-b border-[#b7cbd6] pb-1 text-lg font-bold text-[#164b70]",
							},
							"Author Profile: " + name,
						),
						h(
							"div",
							{
								className:
									"mt-4 flex items-start gap-4 border border-[#b7cbd6] bg-[#f8fbfc] p-4 shadow-[inset_0_1px_0_#fff]",
							},
							imageSrc
								? h("img", {
										className:
											"site-profile-frame h-20 w-20 shrink-0 object-cover",
										src: imageSrc,
										alt: name,
									})
								: null,
							h(
								"div",
								{ className: "flex-1" },
								h(
									"h3",
									{ className: "font-bold text-base text-[#164b70]" },
									name,
								),
								h(
									"p",
									{ className: "mt-2 text-xs leading-relaxed text-[#26343d]" },
									bio,
								),
							),
						),
						h(
							"p",
							{ className: "mt-6" },
							h(
								"a",
								{
									className: "text-[#064f83] underline hover:text-[#c0392b]",
									href: "/",
								},
								"← back to home",
							),
						),
					);

					return renderFullSiteShell(
						"AUTHOR PROFILE",
						name,
						authorContent,
						"about",
						[{ label: "about", url: "/about/" }, { label: name }],
					);
				},
			});
			CMS.registerPreviewTemplate("authors", AuthorPreview);
		</script>
	</body>
</html>
