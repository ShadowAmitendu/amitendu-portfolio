<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Content Manager</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="alternate icon" href="/favicon.ico" />
		<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
	</head>
	<body>
		<script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
		<script>
			// 1. Inject site stylesheet, Barlow Condensed, and Bebas Neue fonts into the preview iframe
			CMS.registerPreviewStyle(
				"https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Bebas+Neue&display=swap",
			);
			CMS.registerPreviewStyle("/assets/styles.css");

			// Helper function to render the full site shell (header banner, nav, sidebars, footer)
			// Helper function to render the full site shell (header banner, nav, sidebars, footer)
			function renderFullSiteShell(
				headerTagline,
				pageTitle,
				contentChildren,
				activeNavKey,
				breadcrumbs,
			) {
				var navItems = [
					{ key: "home", label: "home", url: "/" },
					{ key: "about", label: "about", url: "/about/" },
					{ key: "portfolio", label: "portfolio", url: "/portfolio/" },
					{ key: "blog", label: "blog", url: "/blog/" },
					{ key: "resume", label: "resume", url: "/resume/" },
				];

				var navElements = [];
				navItems.forEach(function (item, idx) {
					if (idx > 0) {
						navElements.push(
							h(
								"span",
								{ key: "sep-" + idx, className: "px-1 text-[#8aa2af]" },
								"|",
							),
						);
					}
					var isActive = activeNavKey === item.key;
					navElements.push(
						h(
							"a",
							{
								key: item.key,
								className:
									"site-nav-link px-2 py-0.5 " +
									(isActive
										? "bg-[#164b70] text-white font-bold shadow-[inset_0_1px_2px_rgba(0,0,0,0.35)] no-underline"
										: "text-[#064f83] underline hover:text-[#c0392b] hover:bg-[#dce9f0]"),
								href: item.url,
							},
							item.label,
						),
					);
				});

				var breadcrumbElements = null;
				if (activeNavKey !== "home" && breadcrumbs && breadcrumbs.length) {
					var bcChildren = [
						h(
							"span",
							{ key: "loc-label", className: "font-bold text-[#164b70]" },
							"Location:",
						),
						h(
							"a",
							{
								key: "bc-home",
								className: "text-[#064f83] underline hover:text-[#c0392b]",
								href: "/",
							},
							"home",
						),
						h("span", { key: "bc-sep-0", className: "text-[#8aa2af]" }, ">"),
					];
					breadcrumbs.forEach(function (crumb, cIdx) {
						if (cIdx > 0) {
							bcChildren.push(
								h(
									"span",
									{ key: "bc-sep-" + (cIdx + 1), className: "text-[#8aa2af]" },
									">",
								),
							);
						}
						if (crumb.url && cIdx < breadcrumbs.length - 1) {
							bcChildren.push(
								h(
									"a",
									{
										key: "bc-" + cIdx,
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: crumb.url,
									},
									crumb.label,
								),
							);
						} else {
							bcChildren.push(
								h(
									"span",
									{ key: "bc-" + cIdx, className: "font-bold text-[#164b70]" },
									crumb.label,
								),
							);
						}
					});
					breadcrumbElements = h(
						"div",
						{
							className:
								"site-nav-breadcrumbs flex flex-wrap items-center justify-center gap-1.5 border-t border-[#c6d7e0] bg-[#edf4f7] px-5 py-1 text-[14px] text-[#536a75] shadow-[inset_0_1px_0_#fff]",
						},
						bcChildren,
					);
				}

				var sidebarLinks = navItems.map(function (item) {
					var isActive = activeNavKey === item.key;
					return h(
						"p",
						{ key: "side-" + item.key },
						isActive
							? h(
									"span",
									{
										className:
											"inline-block bg-[#164b70] text-white font-bold px-1.5 py-0.5 text-[14px] shadow-[inset_0_1px_2px_rgba(0,0,0,0.3)]",
									},
									item.label,
								)
							: h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: item.url,
									},
									item.label,
								),
					);
				});

				return h(
					"div",
					{
						className:
							"site-body min-h-screen px-2 py-6 font-['Barlow_Condensed',sans-serif] text-[#222]",
					},
					h(
						"main",
						{ className: "site-shell mx-auto max-w-6xl p-1" },
						// Header with CRT monitors banner
						h(
							"header",
							{ className: "site-header relative overflow-hidden text-white" },
							h("img", {
								className:
									"site-header-banner absolute inset-0 h-full w-full object-cover",
								src: "/images/header-banner.jpg",
								alt: "",
							}),
							h(
								"div",
								{ className: "relative px-5 py-4" },
								h(
									"p",
									{
										className:
											"text-center text-xs tracking-[0.2em] text-[#b8d9e8]",
									},
									headerTagline || "MY WEB LOG",
								),
								h(
									"h1",
									{
										className:
											"mt-1 text-center font-[Trebuchet_MS,Verdana,sans-serif] tracking-tight",
									},
									pageTitle || "Amitendu Bikash Dhusiya",
								),
							),
						),

						// Navigation bar with active link background & breadcrumbs
						h(
							"nav",
							{ className: "site-nav text-xs" },
							h(
								"div",
								{
									className:
										"site-nav-links flex flex-wrap items-center justify-center gap-1 px-5 py-1.5",
								},
								navElements,
							),
							breadcrumbElements,
						),

						// 3 Columns: Left Sidebar, Main Content, Right Sidebar
						h(
							"div",
							{ className: "site-columns" },
							// Left Sidebar
							h(
								"aside",
								{ className: "site-sidebar site-sidebar-left" },
								h(
									"div",
									{ className: "site-sidebar-card mb-4" },
									h("div", { className: "site-sidebar-card-header" }, "About Me"),
									h(
										"div",
										{ className: "site-sidebar-card-body" },
										h(
											"div",
											{ className: "flex items-center gap-2.5" },
											h("img", {
												className: "site-profile-frame h-11 w-11 shrink-0 object-cover",
												src: "/images/shadow-amitendu.jpg",
												alt: "Amitendu",
												width: 44,
												height: 44,
											}),
											h(
												"div",
												{ className: "min-w-0" },
												h("p", { className: "truncate font-bold leading-tight text-[#164b70] text-sm" }, "Amitendu"),
												h("p", { className: "mt-0.5 text-[11px] leading-tight text-[#556b78]" }, "Developer & Maker"),
											),
										),
										h("p", { className: "mt-2.5 text-[12px] leading-snug text-[#3b4d57] border-t border-[#d8e3ea] pt-2" }, "Building small things for the web."),
										h(
											"div",
											{ className: "mt-2.5" },
											h(
												"a",
												{
													className: "site-button-2007",
													href: "/resume/",
												},
												"View Resume",
											),
										),
									),
								),
								h("h2", null, "Navigate"),
								sidebarLinks,
							),

							// Main Article / Content
							h(
								"section",
								{ className: "site-content px-5 py-6 text-sm leading-6" },
								contentChildren,
							),

							// Right Sidebar
							h(
								"aside",
								{ className: "site-sidebar site-sidebar-right" },
								h("h2", null, "Elsewhere"),
								h(
									"div",
									{ className: "mt-2 space-y-2" },
									h(
										"div",
										null,
										h(
											"a",
											{
												className:
													"flex items-center gap-2 text-[#064f83] hover:text-[#c0392b]",
												href: "https://github.com/ShadowAmitendu",
											},
											h("img", {
												className:
													"site-macos-icon h-5 w-5 shrink-0 rounded-[4.5px] shadow-[0_1px_2px_rgba(0,0,0,0.25)]",
												src: "/assets/icons/macos-github.png",
												alt: "",
												width: 20,
												height: 20,
											}),
											h("span", { className: "underline" }, "GitHub"),
										),
									),
									h(
										"div",
										null,
										h(
											"a",
											{
												className:
													"flex items-center gap-2 text-[#064f83] hover:text-[#c0392b]",
												href: "https://www.youtube.com/@ShadowAmitendu",
											},
											h("img", {
												className:
													"site-macos-icon h-5 w-5 shrink-0 rounded-[4.5px] shadow-[0_1px_2px_rgba(0,0,0,0.25)]",
												src: "/assets/icons/macos-youtube.png",
												alt: "",
												width: 20,
												height: 20,
											}),
											h("span", { className: "underline" }, "YouTube"),
										),
									),
								),
								h(
									"div",
									{ className: "mt-5 border-t border-[#b7cbd6] pt-3" },
									h("h2", null, "Recent Posts"),
									h(
										"div",
										{ className: "mt-2 space-y-2" },
										h("p", { className: "text-[12px] italic text-[#71828b]" }, "No posts yet."),
									),
								),
								h(
									"div",
									{ className: "mt-5 border-t border-[#b7cbd6] pt-3" },
									h("h2", null, "Favorites"),
									h(
										"div",
										{ className: "mt-2 space-y-2" },
										h("p", { className: "text-[12px] italic text-[#71828b]" }, "No favorites tagged yet."),
									),
								),
							),
						),

						// Footer
						h(
							"footer",
							{
								className:
									"site-footer px-5 py-4 text-center text-[14px] text-[#71828b]",
							},
							h(
								"p",
								{ className: "font-bold text-[#164b70]" },
								"Thanks for stopping by!",
							),
							h(
								"p",
								{ className: "mt-1" },
								"© " +
									new Date().getFullYear() +
									" Amitendu Bikash Dhusiya. All rights reserved.",
							),
							h(
								"p",
								{ className: "mt-2" },
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/",
									},
									"home",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/about/",
									},
									"about",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/blog/",
									},
									"blog",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/portfolio/",
									},
									"portfolio",
								),
								h("span", { className: "px-1" }, "·"),
								h(
									"a",
									{
										className: "text-[#064f83] underline hover:text-[#c0392b]",
										href: "/resume/",
									},
									"resume",
								),
							),
							h(
								"p",
								{ className: "mt-2 text-[10px]" },
								"Last updated: " +
									new Date().toLocaleDateString("en-US", {
										month: "short",
										day: "numeric",
										year: "numeric",
									}),
							),
						),
					),
				);
			}

			// 2. Custom Blog Post Preview in Full Site Shell
			var BlogPreview = createClass({
				render: function () {
					var entry = this.props.entry;
					var title = entry.getIn(["data", "title"]) || "Untitled Post";
					var headerTagline =
						entry.getIn(["data", "headerTagline"]) || "BLOG POST";
					var date = entry.getIn(["data", "date"]);
					var author =
						entry.getIn(["data", "author"]) || "Amitendu Bikash Dhusiya";
					var description = entry.getIn(["data", "description"]);
					var rawImage = entry.getIn(["data", "image"]);
					var image = rawImage ? this.props.getAsset(rawImage) : null;
					var body = this.props.widgetFor("body");
					var tags = entry.getIn(["data", "tags"]);
					var isDraft =
						entry.getIn(["data", "draft"]) ||
						(tags &&
							(typeof tags === "string"
								? tags === "draft"
								: tags.includes
									? tags.includes("draft")
									: false));

					var formattedDate = date
						? new Date(date).toLocaleDateString("en-US", {
								month: "short",
								day: "numeric",
								year: "numeric",
							})
						: "Draft";

					var articleContent = h(
						"article",
						{ className: "site-entry" },
						// Header
						h(
							"header",
							{
								className:
									"site-entry-header border border-[#b2c2cc] bg-gradient-to-b from-[#f8fbfc] to-[#dce8ee] p-3.5 shadow-[inset_0_1px_0_#fff]",
							},
							h(
								"div",
								{
									className:
										"flex flex-wrap items-center justify-between gap-2 text-[14px] text-[#536a75]",
								},
								h(
									"div",
									{ className: "flex items-center gap-2" },
									h(
										"span",
										{
											className:
												"inline-block bg-[#164b70] px-1.5 py-0.5 text-[9px] font-bold tracking-wider text-white uppercase",
										},
										"ENTRY",
									),
									isDraft
										? h(
												"span",
												{
													className:
														"inline-block bg-[#d97706] px-1.5 py-0.5 text-[9px] font-bold tracking-wider text-white uppercase",
												},
												"DRAFT",
											)
										: null,
									h(
										"time",
										{ className: "font-bold text-[#164b70]" },
										formattedDate,
									),
								),
								h(
									"div",
									{ className: "text-[14px]" },
									"written by ",
									h("span", { className: "font-bold text-[#164b70]" }, author),
								),
							),
							h(
								"h1",
								{
									className:
										"site-entry-title mt-2 font-bold tracking-tight text-[#164b70]",
								},
								title,
							),
							description
								? h(
										"p",
										{ className: "mt-1 text-xs italic text-[#71828b]" },
										description,
									)
								: null,
						),

						isDraft
							? h(
									"div",
									{
										className:
											"my-3 border border-dashed border-[#d97706] bg-[#fffbeb] px-3.5 py-2 text-xs font-bold text-[#b45309]",
									},
									"DRAFT - This post is saved as a draft and is hidden from public blog listings.",
								)
							: null,

						// Featured image
						image
							? h(
									"div",
									{
										className:
											"site-entry-image-frame my-4 border border-[#7892a3] bg-white p-1 shadow-[2px_2px_0_#b8c5cc]",
									},
									h("img", {
										className: "h-auto w-full object-contain",
										src: image.toString(),
										alt: title,
									}),
								)
							: null,

						// Body
						h(
							"div",
							{
								className:
									"site-entry-body mt-4 text-sm leading-relaxed text-[#26343d]",
							},
							body,
						),

						// Footer
						h(
							"footer",
							{
								className:
									"site-entry-footer mt-4 border-t border-dashed border-[#b7cbd6] pt-3 text-xs text-[#71828b]",
							},
							h(
								"div",
								{
									className:
										"flex flex-wrap items-center justify-between gap-3",
								},
								h(
									"div",
									{ className: "flex items-center gap-1.5" },
									h(
										"span",
										{ className: "font-bold text-[#164b70]" },
										"Filed under:",
									),
									h(
										"span",
										{
											className:
												"site-badge border border-[#7398b0] bg-[#e8f3f8] px-1.5 py-0.5 text-[10px] text-[#164b70]",
										},
										"blog",
									),
								),
								h(
									"div",
									{ className: "flex items-center gap-2 text-[14px]" },
									h(
										"span",
										{ className: "text-[#064f83] underline" },
										"Comments (IntenseDebate)",
									),
									h("span", null, "·"),
									h(
										"span",
										{ className: "text-[#064f83] underline" },
										"permalink",
									),
									h("span", null, "·"),
									h("span", { className: "text-[#064f83] underline" }, "top"),
								),
							),
						),

						// Comments Box
						h(
							"section",
							{ className: "site-comments mt-8 p-4" },
							h(
								"h3",
								{
									className:
										"border-b border-[#b7cbd6] pb-1 font-[Trebuchet_MS,Verdana,sans-serif] text-base font-bold text-[#164b70]",
								},
								"Comments",
							),
							h(
								"div",
								{ className: "mt-3 text-xs text-[#71828b]" },
								h(
									"p",
									null,
									"IntenseDebate comment stream will display here on published site.",
								),
							),
						),

						// Back link
						h(
							"nav",
							{ className: "mt-6 border-t border-[#b7cbd6] pt-4 text-xs" },
							h(
								"a",
								{
									className: "text-[#064f83] underline hover:text-[#c0392b]",
									href: "/blog/",
								},
								"« Return to Web Log Index",
							),
						),
					);

					return renderFullSiteShell(
						headerTagline,
						title,
						articleContent,
						"blog",
						[{ label: "blog", url: "/blog/" }, { label: title }],
					);
				},
			});
			CMS.registerPreviewTemplate("blog", BlogPreview);

			// 3. Custom Portfolio Project Preview in Full Site Shell
			var PortfolioPreview = createClass({
				render: function () {
					var entry = this.props.entry;
					var title = entry.getIn(["data", "title"]) || "Untitled Project";
					var headerTagline =
						entry.getIn(["data", "headerTagline"]) || "PORTFOLIO PROJECT";
					var description = entry.getIn(["data", "description"]);
					var rawImage = entry.getIn(["data", "image"]);
					var image = rawImage ? this.props.getAsset(rawImage) : null;
					var body = this.props.widgetFor("body");
					var tags = entry.getIn(["data", "tags"]);
					var isDraft =
						entry.getIn(["data", "draft"]) ||
						(tags &&
							(typeof tags === "string"
								? tags === "draft"
								: tags.includes
									? tags.includes("draft")
									: false));

					var portfolioContent = h(
						"div",
						null,
						h(
							"div",
							{ className: "flex items-center gap-2" },
							h(
								"p",
								{ className: "text-xs text-[#71828b]" },
								"portfolio / project",
							),
							isDraft
								? h(
										"span",
										{
											className:
												"inline-block bg-[#d97706] px-1.5 py-0.5 text-[9px] font-bold tracking-wider text-white uppercase",
										},
										"DRAFT",
									)
								: null,
						),
						h(
							"h1",
							{
								className:
									"site-entry-title mt-2 border-b border-[#b7cbd6] pb-1 font-bold text-[#164b70]",
							},
							title,
						),
						description
							? h(
									"p",
									{ className: "mt-2 text-sm italic text-[#536a75]" },
									description,
								)
							: null,
						isDraft
							? h(
									"div",
									{
										className:
											"my-3 border border-dashed border-[#d97706] bg-[#fffbeb] px-3.5 py-2 text-xs font-bold text-[#b45309]",
									},
									"DRAFT - This project is saved as a draft and is hidden from public listings.",
								)
							: null,
						image
							? h(
									"div",
									{
										className:
											"site-entry-image-frame my-4 border border-[#7892a3] bg-white p-1 shadow-[2px_2px_0_#b8c5cc]",
									},
									h("img", {
