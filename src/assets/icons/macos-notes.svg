<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="notes-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
    <linearGradient id="notes-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b26a00" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <clipPath id="notes-clip">
      <rect x="2" y="2" width="28" height="28" rx="6.5"/>
    </clipPath>
  </defs>
  <rect x="2" y="2" width="28" height="28" rx="6.5" fill="url(#notes-bg)" filter="url(#shadow)"/>
  <g clip-path="url(#notes-clip)">
    <!-- Top Orange Binder Band -->
    <rect x="2" y="2" width="28" height="8" fill="#f57c00"/>
    <line x1="2" y1="10" x2="30" y2="10" stroke="#b26a00" stroke-width="0.8"/>
    <!-- Ruled blue lines -->
    <line x1="6" y1="14" x2="26" y2="14" stroke="#90caf9" stroke-width="0.8"/>
    <line x1="6" y1="18" x2="26" y2="18" stroke="#90caf9" stroke-width="0.8"/>
    <line x1="6" y1="22" x2="26" y2="22" stroke="#90caf9" stroke-width="0.8"/>
    <line x1="6" y1="26" x2="20" y2="26" stroke="#90caf9" stroke-width="0.8"/>
  </g>
  <rect x="2.5" y="2.5" width="27" height="27" rx="6" fill="none" stroke="url(#notes-border)" stroke-width="1"/>
</svg>
