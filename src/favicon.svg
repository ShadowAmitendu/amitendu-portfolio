<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Monitor Outer Bezel Shadow & Shell -->
  <rect x="2" y="2" width="28" height="22" fill="#0d293d" />
  <rect x="3" y="3" width="26" height="20" fill="#164b70" />
  
  <!-- Bevel Highlights (Top & Left) -->
  <rect x="3" y="3" width="26" height="1" fill="#437d9f" />
  <rect x="3" y="4" width="1" height="19" fill="#437d9f" />
  
  <!-- Bevel Shadows (Bottom & Right) -->
  <rect x="3" y="22" width="26" height="1" fill="#0a2030" />
  <rect x="28" y="3" width="1" height="20" fill="#0a2030" />

  <!-- CRT Screen Inset Bezel -->
  <rect x="5" y="5" width="22" height="14" fill="#071926" />
  <rect x="6" y="6" width="20" height="12" fill="#040d14" />

  <!-- CRT Glare (Top subtle glass reflection) -->
  <rect x="7" y="7" width="5" height="1" fill="#123851" />
  <rect x="7" y="8" width="3" height="1" fill="#123851" />

  <!-- Terminal Prompt (> _) in Glowing Retro Cyan -->
  <!-- ">" Character -->
  <rect x="8" y="10" width="2" height="1" fill="#00f0ff" />
  <rect x="10" y="11" width="2" height="1" fill="#00f0ff" />
  <rect x="12" y="12" width="2" height="1" fill="#00f0ff" />
  <rect x="10" y="13" width="2" height="1" fill="#00f0ff" />
  <rect x="8" y="14" width="2" height="1" fill="#00f0ff" />

  <!-- Blinking Block Cursor -->
  <rect x="15" y="10" width="3" height="5" fill="#00f0ff" />

  <!-- Power Button & Glowing Green LED -->
  <rect x="22" y="20" width="2" height="1" fill="#0a2030" />
  <rect x="25" y="20" width="2" height="1" fill="#22c55e" />

  <!-- Stand Neck -->
  <rect x="13" y="24" width="6" height="3" fill="#0d293d" />
  <rect x="14" y="24" width="4" height="3" fill="#164b70" />

  <!-- Stand Base -->
  <rect x="8" y="27" width="16" height="3" fill="#0d293d" />
  <rect x="9" y="28" width="14" height="2" fill="#1b5177" />
  <rect x="9" y="27" width="14" height="1" fill="#437d9f" />
  <rect x="8" y="29" width="16" height="1" fill="#071926" />
</svg>
